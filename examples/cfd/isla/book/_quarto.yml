project:
  type: book
  output-dir: _book

book:
  title: "ISLA: Invariant Slice Attention"
  subtitle: "A guide to a neural surrogate for boundary-driven PDEs that is exact under rigid motions and consistent under remeshing: how it works, how to use it, and how it measures against GeoTransolver and Transolver"
  chapters:
    - index.qmd
    - part: "I. The problem and the landscape"
      chapters:
        - 01-problem.qmd
        - 02-landscape.qmd
    - part: "II. How ISLA works"
      chapters:
        - 03-isla.qmd
        - 04-invariances.qmd
        - 05-forward-pass.qmd
    - part: "III. Using ISLA"
      chapters:
        - 06-using-isla.qmd
        - 07-benchmark.qmd
    - part: "IV. Evidence"
      chapters:
        - 08-standing.qmd
        - 09-drivaerml.qmd
        - 10-hilift.qmd
        - 11-shift-suv.qmd
        - 12-airfrans.qmd
        - 13-aerozoo.qmd
        - 15-tensile2d.qmd
        - 16-lug.qmd
        - 17-deepjeb.qmd
        - 19-capacity.qmd
    - part: "V. Limits and status"
      chapters:
        - 20-limits.qmd
        - 14-program-status.qmd
  appendices:
    - 21-design.qmd
    - 22-literature.qmd
    - 18-notebook.qmd

execute:
  echo: false
  warning: false
  freeze: false

format:
  html:
    theme: cosmo
    css: book.css         # fit complete figures to their column, including Jupyter output with explicit pixel sizes
    grid:
      body-width: 1000px  # wider reading column; still responsive on small screens
      margin-width: 200px
    lightbox: true        # click a figure to inspect the full-resolution image
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: true
    code-summary: "Show code"
    fig-width: 8
    fig-height: 4.5
    fig-dpi: 150
    fig-align: center
    html-math-method: mathjax
    mermaid:
      theme: neutral
