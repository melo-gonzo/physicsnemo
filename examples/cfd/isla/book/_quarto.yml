project:
  type: book
  output-dir: _book

book:
  title: "ISLA: Invariant Slice Attention for Boundary-to-Field Surrogates"
  subtitle: "A guide to the method, its use, and the evidence, measured against GeoTransolver and Transolver on steady boundary-driven PDE benchmarks"
  chapters:
    - index.qmd
    - part: "I. The problem and the two invariances"
      chapters:
        - 01-problem.qmd
        - 02-isla.qmd
        - 03-invariances.qmd
        - 04-architecture.qmd
    - part: "II. Protocol and use"
      chapters:
        - 05-protocol.qmd
        - 06-using-isla.qmd
    - part: "III. Evidence, by dataset"
      chapters:
        - 07-drivaerml.qmd
        - 08-hilift.qmd
        - 09-airfrans.qmd
        - 10-shift-suv.qmd
        - 11-tensile2d.qmd
        - 12-lug.qmd
        - 13-deepjeb.qmd
        - 15-capacity-scaling-cost.qmd
    - part: "IV. Limits and status"
      chapters:
        - 16-limits.qmd
        - 14-program-status.qmd
  appendices:
    - 17-design-decisions.qmd
    - 19-literature.qmd
    - 18-notebook.qmd

execute:
  echo: false
  warning: false
  freeze: false

format:
  html:
    theme: cosmo
    css: book.css         # fit complete figures to their column, including Jupyter output with explicit pixel sizes
    grid:
      body-width: 1000px  # wider reading column; still responsive on small screens
      margin-width: 200px
    lightbox: true        # click a figure to inspect the full-resolution image
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: true
    code-summary: "Show code"
    fig-width: 8
    fig-height: 4.5
    fig-dpi: 150
    fig-align: center
    html-math-method: mathjax
    mermaid:
      theme: neutral
