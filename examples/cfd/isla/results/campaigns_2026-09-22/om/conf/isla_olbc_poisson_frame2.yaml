# @package _global_
# OLBC-MECH (2026-09-22): the laboratory frame (+x, +y) as two global vectors (eager kernel).
# ISLA on OLBC poisson-square-bc5 (2026-09-22): boundary tokens from the square polyline (line cells) with the one-hot BC type,
# the BC value g and the Robin alpha as boundary scalars; no global condition (the material and domain are fixed, the source is
# a field, and a scalar Poisson solution needs no frame: K = 0); every mesh node as an interacting query token with the signed
# distance and the (standardized) source as its two query scalars.
input_type: tensors
output_type: fields
forward_kwargs:
  points: boundaries.outer.cell_centroids
  normals: boundaries.outer.cell_data.normals              # precomputed in-plane outward normals (a curve in 3-D has no cell_normals)
  measure_weights: boundaries.outer.cell_data.quadrature_measure
  boundary_inputs:                                         # per-boundary-cell fields: which condition, and its value (all rank 0)
    bc_dirichlet: boundaries.outer.cell_data.bc_dirichlet
    bc_neumann: boundaries.outer.cell_data.bc_neumann
    bc_robin: boundaries.outer.cell_data.bc_robin
    bc_value_g: boundaries.outer.cell_data.bc_value_g
    bc_robin_alpha: boundaries.outer.cell_data.bc_robin_alpha
  global_inputs:                                           # the constant laboratory frame as two global directions (olbc_poisson_frame.yaml)
    frame_x: global_data.frame_x
    frame_y: global_data.frame_y
  query_points: interior.points
  query_normals: interior.point_data.sdf_normals
  query_inputs:
    sdf: interior.point_data.sdf
    source: interior.point_data.source                     # standardized in place by the dataset yaml
model:
  _target_: physicsnemo.experimental.models.ISLA
  outputs: {u: 0}
  boundary_inputs: {bc_dirichlet: 0, bc_neumann: 0, bc_robin: 0, bc_value_g: 0, bc_robin_alpha: 0}
  global_inputs: {frame_x: 1, frame_y: 1}
  query_inputs: {sdf: 0, source: 0}
  hidden: 384
  n_layers: 12
  n_slices: 256
  mlp_ratio: 4
  query_tokens: true
  geo_checkpoint: true
  geo_kernel: eager              # the fused kernel requires one global direction
