# @package _global_
# ISLA on GINOT PLASTIC_LUG (2026-09-22): boundary tokens from the watertight surface triangles with the BC labels and the
# applied pressure as boundary scalars and the traction as a boundary vector; the four design parameters (hole radius,
# length, thickness, pressure) as the global condition vector; every mesh node as an interacting query token.
input_type: tensors
output_type: fields
forward_kwargs:
  points: boundaries.surface.cell_centroids
  normals: boundaries.surface.cell_data.normals            # precomputed outward normals (equal to cell_normals up to orientation)
  measure_weights: boundaries.surface.cell_data.quadrature_measure
  boundary_inputs:                                         # per-boundary-cell fields (all rank 0)
    bc_fixed: boundaries.surface.cell_data.bc_fixed
    bc_hole: boundaries.surface.cell_data.bc_hole
    bc_loaded: boundaries.surface.cell_data.bc_loaded
    bc_pressure: boundaries.surface.cell_data.bc_pressure  # MPa, the target's units
  # The traction (-p n on the loaded half) is recoverable from bc_pressure and the cell normal, which the model already
  # sees; this lane keeps the rank-0 inputs of the running ladder. cell_data.traction could be declared as a rank-1 input.
  global_inputs:
    params: global_data.params_std                         # standardized [hole_radius, length, thickness, pressure] (StandardizeDomainGlobalField in the dataset yaml)
  query_points: interior.points
  query_normals: interior.point_data.sdf_normals
  query_inputs:
    sdf: interior.point_data.sdf
model:
  _target_: physicsnemo.experimental.models.ISLA
  outputs: {von_mises: 0}
  boundary_inputs: {bc_fixed: 0, bc_hole: 0, bc_loaded: 0, bc_pressure: 0}
  global_inputs: {params: {rank: 0, channels: 4}}
  query_inputs: {sdf: 0}
  hidden: 384
  n_layers: 12
  n_slices: 256
  mlp_ratio: 4
  query_tokens: true
  geo_checkpoint: true
  geo_kernel: eager              # no global direction: the fused kernel does not apply
