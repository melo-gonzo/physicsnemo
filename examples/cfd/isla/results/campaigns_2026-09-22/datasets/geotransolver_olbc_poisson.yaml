# @package _global_
# GeoTransolver on OLBC poisson-square-bc5 (2026-09-22): the recipe's volume configuration on the interior inputs (coordinates,
# signed distance and its direction, the standardized source, nodal BC tags and values). GeoTransolver has no boundary-token
# path, so the boundary conditions enter only through the nodal tags/values on the boundary nodes; no global embedding (the
# set has no per-sample scalar parameters).
dataset_reader_overrides:
  drop_in_file_boundaries: true
input_type: tensors
output_type: tensors
forward_kwargs:
  geometry: interior.points
  local_embedding:
    - interior.points
    - interior.point_data.sdf
    - interior.point_data.sdf_normals
    - interior.point_data.source
    - interior.point_data.tag_dirichlet
    - interior.point_data.tag_neumann
    - interior.point_data.tag_robin
    - interior.point_data.bc_value_node
    - interior.point_data.bc_robin_alpha_node
  local_positions: interior.points
model:
  _target_: physicsnemo.models.geotransolver.GeoTransolver
  out_dim: ${out_dim}            # 1 (u)
  functional_dim: 13             # 3 + 1 + 3 + 1 + 3 + 1 + 1
  geometry_dim: 3
  global_dim: null
  n_layers: 12
  n_hidden: 512
  dropout: 0.0
  n_head: 8
  act: "gelu"
  mlp_ratio: 4
  slice_num: 256
  use_te: false
  plus: false
  include_local_features: false
  radii: [0.05, 0.2, 0.8]        # coordinates span [-1, 1]
  neighbors_in_radius: [16, 32, 64]
  n_hidden_local: 32
  activation_checkpointing: false
  checkpointing_ratio: 1.0
  activation_checkpointing_components: [blocks]
