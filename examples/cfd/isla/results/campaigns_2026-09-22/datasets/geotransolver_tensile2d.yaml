# @package _global_
# GeoTransolver on PLAID Tensile2d (2026-09-22): the recipe's volume configuration on the interior inputs (coordinates,
# signed distance and its direction, nodal BC tags) with the six input scalars as the global embedding. GeoTransolver has
# no boundary-token path, so the loaded/fixed edges enter only through the nodal tags on the interior points.
dataset_reader_overrides:
  drop_in_file_boundaries: true
input_type: tensors
output_type: tensors
forward_kwargs:
  geometry: interior.points
  local_embedding:
    - interior.points
    - interior.point_data.sdf
    - interior.point_data.sdf_normals
    - interior.point_data.tag_top
    - interior.point_data.tag_bottom
    - interior.point_data.tag_bottomleft
  local_positions: interior.points
  global_embedding: global_data.params_std
model:
  _target_: physicsnemo.models.geotransolver.GeoTransolver
  out_dim: ${out_dim}            # 4 scalars + 3 (displacement) = 7
  functional_dim: 10             # 3 + 1 + 3 + 3
  geometry_dim: 3
  global_dim: 6
  n_layers: 12
  n_hidden: 512
  dropout: 0.0
  n_head: 8
  act: "gelu"
  mlp_ratio: 4
  slice_num: 256
  use_te: false
  plus: false
  include_local_features: false
  radii: [0.05, 0.2, 0.8]        # coordinates span [-1, 1]
  neighbors_in_radius: [16, 32, 64]
  n_hidden_local: 32
  activation_checkpointing: false
  checkpointing_ratio: 1.0
  activation_checkpointing_components: [blocks]
