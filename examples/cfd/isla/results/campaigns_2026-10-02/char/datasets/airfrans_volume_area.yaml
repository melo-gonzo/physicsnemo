# CHAR-PROTOCOLS area variant (2026-10-02): identical to airfrans_volume.yaml except that the drawn surface
# cells follow an area-proportional (uniform-on-the-surface) inclusion law with exact Horvitz-Thompson
# measure weights, "what an STL without a volume mesh would give", instead of the native uniform-over-cells
# draw that reads the mesher's refinement pattern. Here the boundary is kept WHOLE by the base reader (fewer
# cells than ${sampling_resolution}) and the interior is a point cloud drawn uniformly over points with no
# cell measures, so no volume-proportional draw exists for it. PoissonBiasedSubsampleMesh(weight_mode=area) is
# applied to the boundary at the same expected count and is the identity whenever the boundary has at most
# that many cells: at the campaign cell counts this variant equals the native set BY CONSTRUCTION and is
# scored only as the uniform third protocol column.
# Evaluation-only protocol: train natively, score the native checkpoint on this variant.

# AirfRANS (Bonnet et al., 2022) as a boundary-to-interior dataset, converted to native DomainMesh files by
# kernel/airfrans_convert.py (AIRFRANS-INT, 2026-09-21). Two-dimensional incompressible k-omega SST RANS around
# NACA airfoils at z = 0: interior = point cloud with velocity, pressure (kinematic), nut, sdf (positive outside)
# and sdf_normals; boundary "airfoil" = line cells with precomputed in-plane normals and segment lengths as the
# quadrature measure; global_data: U_inf, U_inf_dir, U_inf_mag, aoa_deg, Re, rho_inf = 1, p_inf = 0.
# Splits come from the dataset's manifest (full_train/full_test, scarce_train, reynolds_*, aoa_*); select with
# train_split=full_train val_split=full_test.
train_datadir: /scratch/fsw/portfolios/coreai/projects/coreai_modulus_cae/users/psharpe/datasets/airfrans_pdmsh
manifest: /scratch/fsw/portfolios/coreai/projects/coreai_modulus_cae/users/psharpe/datasets/airfrans_pdmsh/manifest.json

pipeline:
  reader:
    _target_: ${dp:DomainMeshReader}
    path: ${train_datadir}
    pattern: "airFoil2D_SST_*/*.pdmsh"
    subsample_n_points: ${sampling_resolution}   # interior queries (each case has ~177k points)
    subsample_n_cells: ${sampling_resolution}    # larger than any airfoil's ~1,000 segments: the boundary is kept whole
    drop_interior_cells: true
    drop_in_file_boundaries: false
  transforms:
    - _target_: ${dp:NonDimensionalizeByMetadata}
      fields:
        velocity: velocity          # U / |U_inf|
        pressure: pressure          # (p - p_inf) / (0.5 rho_inf |U_inf|^2) with rho_inf = 1, p_inf = 0 (kinematic p)
        nut: identity
      association: point_data
    - _target_: ${dp:NormalizeMeshFields}
      association: point_data
      fields:
        nut: {type: scalar, mean: 7.9e-4, std: 2.4e-3}   # raw nut [m^2/s], mean and std over the converter per-case statistics (2026-09-21)

    - _target_: ${dp:PoissonBiasedSubsampleMesh}   # CHAR-PROTOCOLS area: inclusion probability proportional to cell area, exact HT weights
      n_cells_expected: ${sampling_resolution}
      weight_mode: area

targets:
  pressure: scalar
  nut: scalar
  velocity: vector
