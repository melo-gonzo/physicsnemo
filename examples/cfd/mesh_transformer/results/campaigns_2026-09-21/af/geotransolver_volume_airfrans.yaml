# @package _global_
# GeoTransolver-volume on AirfRANS (AIRFRANS-INT): the recipe's volume configuration on the same interior inputs
# (coordinates, signed distance and its direction; freestream velocity as the global embedding).
dataset_reader_overrides:
  drop_in_file_boundaries: true
input_type: tensors
output_type: tensors
forward_kwargs:
  geometry: interior.points
  local_embedding:
    - interior.points
    - interior.point_data.sdf
    - interior.point_data.sdf_normals
  local_positions: interior.points
  global_embedding: global_data.U_inf
model:
  _target_: physicsnemo.models.geotransolver.GeoTransolver
  out_dim: ${out_dim}
  functional_dim: 7
  geometry_dim: 3
  global_dim: 3
  n_layers: 12
  n_hidden: 256
  dropout: 0.0
  n_head: 8
  act: "gelu"
  mlp_ratio: 4
  slice_num: 256
  use_te: false
  plus: false
  include_local_features: false
  radii: [0.1, 0.5, 2.0]
  neighbors_in_radius: [16, 32, 64]
  n_hidden_local: 32
  activation_checkpointing: false
  checkpointing_ratio: 1.0
  activation_checkpointing_components: [blocks]
