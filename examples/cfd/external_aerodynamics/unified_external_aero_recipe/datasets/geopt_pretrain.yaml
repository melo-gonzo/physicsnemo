# GeoPT pretraining dataset (DomainMesh-native).
# Loads `*.pdmsh` directories emitted by
# `physicsnemo.experimental.pnm_pretraining.data.build_pretraining_sample`.
# See `geopt-datagen-round1-plan.md` §A (geometry-direction conventions)
# and §5 (M3 schema) for the corpus contract.
#
# On-disk schema (per the M3 builder):
#   interior:
#     points: (n_volume + n_surface, 3) float32
#     point_data: region, sdf, normals_face_barycentric, normals_vertex_nearest
#     global_data: walks_supervise (n_walks, n_points, n_steps, 3),
#                  walks_directions (n_walks, n_points, 3),
#                  walks_step_lengths (n_walks, n_points),
#                  walks_is_independent (n_walks,)
#   boundaries.geometry: aligned trimesh (vertices + faces).
#   global_data: config / alignment / mesh_quality (informational).
#
# Pipeline path:
#   1. DomainMeshReader loads the .pdmsh.
#   2. WalkSampler picks one walk per __getitem__ and lifts
#      (`directions`, `step_lengths`, and `n_steps` per-step
#      `supervise_step{i}` vector fields) into interior.point_data so
#      the recipe's extract_targets / forward_kwargs can reach them.
#      The (n_walks, ...) source arrays are dropped from
#      interior.global_data.
#
# Pretraining is geometry-fixed: the supervision data was generated
# against a specific aligned mesh, so we do NOT add random rotations /
# translations here (unlike drivaer_ml_volume.yaml).
#
# Note: the M3 builder writes informational scalars (`mesh_quality`,
# `alignment`, `config`) to `domain.global_data` (domain-level, not
# inside any Mesh's `global_data`). They are ignored by the recipe's
# extract_targets / forward_kwargs and do not need to be dropped here;
# `${dp:DropMeshFields}` only operates on Mesh-level `global_data`.

train_datadir: ${dataset_paths.geopt_pretrain}

pipeline:
  reader:
    _target_: ${dp:DomainMeshReader}
    path: ${train_datadir}
    # Builder writes `<prefix>.pdmsh/` directories (atomic rename from
    # `.pdmsh.tmp/`); both extensions are directories per F0.3 in the
    # round-1 plan. `**/*.pdmsh` matches the final directory layout.
    pattern: "**/*.pdmsh"
  augmentations: []
  transforms:
    - _target_: physicsnemo.experimental.pnm_pretraining.data.WalkSampler
      seed: ${training.seed}
      # `supervise_field_prefix` defaults to "supervise_step" — matches
      # the per-step keys declared in the targets block below. Override
      # only if the targets block is renamed in lockstep.

# `targets:` declares what the loss/metric/output_normalize see in the
# recipe's per-field flow.
#
# WARNING — n_steps coupling.
#   The number of `supervise_step{i}` entries below MUST equal
#   `model.n_steps` in `conf/model/transolver_pretrain.yaml`. If you
#   override `model.n_steps` on the CLI, you MUST also override this
#   `targets:` block to declare exactly `n_steps` fields. Failure to
#   keep them in lockstep produces a "shape (B, N, n_steps*3) cannot be
#   split into 3 vector fields" error from
#   output_normalize.split_concat_by_target, far from the override
#   site. The same warning lives in conf/model/transolver_pretrain.yaml.
#   See pr2-recipe-extension-plan.md T1.3 for a possible follow-up
#   (OmegaConf resolver that auto-generates this list from n_steps).
#
# PR 2 follow-up — per-step vector decomposition.
#   The recipe's `FieldType` is `Literal["scalar", "vector"]` and a
#   ``vector`` consumes exactly `n_spatial_dims = 3` channels. The
#   model emits a flat `(B, N, n_steps * 3)` trajectory tensor; rather
#   than introducing a new FieldType (e.g. "trajectory"), we declare
#   one ``vector`` field per trajectory step. The recipe's
#   `output_normalize.split_concat_by_target` then slices the model
#   output into `n_steps` `(B, N, 3)` chunks by name (in declaration
#   order), and `extract_targets` pulls the matching per-step keys
#   produced by `WalkSampler` from `interior.point_data`. No
#   recipe-side code changes required.
#
#   The number of fields listed here MUST match the `n_steps` the
#   corpus was generated with (see
#   `physicsnemo.experimental.pnm_pretraining.data.build_pretraining_sample`,
#   default `n_steps=3`, matching GeoPT's released code) and the
#   `model.n_steps` value in `conf/model/transolver_pretrain.yaml`.
#   Override on CLI for `n_steps != 3` (e.g.
#   `++dataset.targets.supervise_step3=vector …`).
targets:
  supervise_step0: vector
  supervise_step1: vector
  supervise_step2: vector
