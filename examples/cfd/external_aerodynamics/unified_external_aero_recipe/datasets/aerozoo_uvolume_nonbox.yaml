# Statistics filled by aerozoo_pstats.py fill from pstats_family_non_box.train.json: split part family_non_box.train, 2390 cases, 47,800,000 interior points, 397,755,970 expected boundary tokens (log10 nu mean -5.047, std 1.766).
# AeroZoo v1.2 (2026-10-09; inputs corrected 2026-10-19), interior task: the four grouped boundaries with their
# boundary conditions -> the RANS fields at the interior cell centroids, with the PDE data only, in physical units,
# the same for every model. Under the rulings of 2026-10-15 (a model reads only the boundary meshes with their
# condition types, the prescribed values and the kinematic viscosity; density only to convert pressure and shear;
# every other global_data leaf is a label) and 2026-10-19 (no model is given a per-sample reference length: "If a
# model wants normalized coordinates, it needs to bring it to the table"), nothing here reads a label or derives a
# per-case scale. The 2026-10-19 correction replaced the earlier chain in place: it removed the reference.* renames
# (U_inf, L_ref), ComputeLogReynolds, both NonDimensionalizeByMetadata, CenterMesh (the coordinates stay raw, in
# metres), ComputeFreestreamDirection, the inlet reductions BoundaryFieldToGlobal / SplitGlobalVector /
# global_vector (derived by the recipe) and sdf_slip (its fill for a case without slip walls is the bounding-box
# diagonal, a per-case length).
#   The chain: a uniform 50,000-face draw per boundary (the release stores the boundaries in OpenFOAM face order,
#   so the reader reads them whole and SubsampleMesh draws first, with the Horvitz-Thompson measure N/k), one
#   boundary grammar (HarmonizeBoundaryFields), the prescribed values renamed bc_* in SI units (m/s, Pa, m^2/s^2,
#   1/s), the signed distance and normal to no_slip in metres (both baselines' published body-SDF input), nu_std =
#   (log10 nu - a) / b with per-dataset constants (StandardizeGlobalLeaf), the reorientation, the targets, and the
#   boundary faces as one token set (MergeBoundaries), GeoTransolver's geometry.
# Every constant below is fitted once per split on its training side (aerozoo_pstats.py); nothing is computed per
# case. The targets are physical (m/s, Pa, m^2/s, m^2/s^2, 1/s) with one scale-only standardization per dataset,
# the same for every model (means 0), so the recipe's training-space relative L2 is the physical relative L2 of
# each field and case.
#
# Release layout (3,816 cases, dimensional SI, `shard-NNN/<case_id>/domain.pdmsh`): the interior is the cell
# centroids (0.6M to 24M per case) with point_data.solution.*; the boundaries inlet / outlet / no_slip / slip are
# triangles with cell_data prescribed.dirichlet.* and prescribed.reverse_flow.* (a slip mesh can have 0 faces);
# global_data holds physics.{density, kinematic_viscosity, ...} and the labels reference.*, identity.*,
# solution_definition.*, diagnostics.*. The recipe reads the row-shuffled copy (datasets/aerozoo_v1.2_shuf_pdmsh),
# so the reader's contiguous interior block is a uniform sample. Splits: manifest.json, keys `<split>.<part>`.
