# Reference interior dataset (2026-09-14): drivaer_ml_volume.yaml plus, after the
# boundary is reduced to {vehicle}, ComposeQuadratureMeasure, which writes the
# Horvitz-Thompson-corrected cell
# effective measure (including all sampling corrections) to
# boundaries.vehicle.cell_data._effective_measure for conf/model/isla_volume.yaml.
# The reader subsamples boundaries by cells (boundary_subsample: cells), which is
# what records the inclusion probabilities the correction needs.
