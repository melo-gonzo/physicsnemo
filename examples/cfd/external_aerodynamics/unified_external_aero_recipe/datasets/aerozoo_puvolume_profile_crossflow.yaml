# Statistics filled by aerozoo_pstats.py fill from pstats_profile_crossflow.train.json: split part profile_crossflow.train, 2820 cases, 56,400,000 interior points, 421,925,282 expected boundary tokens (log10 nu mean -5.052, std 1.773).
# AZ-COMPLIANT v2 (2026-10-19): AeroZoo with the PDE data only, in physical units, the same for every model.
# Under the rulings of 2026-10-15 (a model reads only the boundary meshes with their condition types, the
# prescribed values and the kinematic viscosity; density only to convert pressure and shear; every other
# global_data leaf is a label) and 2026-10-19 (no model is given a per-sample reference length: "If a model
# wants normalized coordinates, it needs to bring it to the table"), this is aerozoo_uvolume.yaml with every
# label read and every per-case derived scale removed:
#   removed: the reference.* renames (U_inf, L_ref), ComputeLogReynolds, both NonDimensionalizeByMetadata,
#            CenterMesh (the coordinates stay raw, in metres), ComputeFreestreamDirection, the inlet reductions
#            BoundaryFieldToGlobal / SplitGlobalVector / global_vector (derived by the recipe), and sdf_slip
#            (its fill for a case without slip walls is the bounding-box diagonal, a per-case length);
#   kept:    the uniform 50,000-face draw per boundary, the one boundary grammar (HarmonizeBoundaryFields),
#            the prescribed values renamed bc_* in SI units (m/s, Pa, m^2/s^2, 1/s), the signed distance and
#            normal to no_slip in metres (both baselines' published body-SDF input) and the reorientation;
#   added:   nu_std = (log10 nu - a) / b with per-dataset constants (StandardizeGlobalLeaf), the baselines'
#            global input; the boundary faces as one token set (MergeBoundaries), GeoTransolver's geometry.
# Every constant below is fitted once per split on its training side; nothing is computed per case. The
# targets are physical (m/s, Pa, m^2/s, m^2/s^2, 1/s) with one scale-only standardization per dataset, the
# same for every model (means 0). Release layout, reader and splits: aerozoo_volume.yaml and aerozoo_uvolume.yaml.
