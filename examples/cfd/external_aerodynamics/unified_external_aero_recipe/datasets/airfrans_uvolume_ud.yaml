# DRIVE-FIX R1 (2026-10-18): airfrans_uvolume.yaml plus one last transform, a SplitGlobalVector that writes the standardized
# freestream speed U_inf_mag_std = (U_inf_mag - 62.116) / 17.914 as a rank-0 global leaf (mean and population std of
# global_data.U_inf_mag over the 800 full_train cases, read from the case files on 2026-10-18; the raw U_inf_mag stays).
# The AirfRANS baselines (GeoTransolver, Transolver) read [U_inf_dir, U_inf_mag_std] instead of the raw U_inf vector
# (31-94 m/s): the same information ISLA reads (U_inf_dir and the speed), scaled to O(1). Everything else is the source file's.

# AF-UNIFORM (2026-10-14): airfrans_volume.yaml with a uniform interior draw. AirfRANS stores the interior points in
# solver (VTU) order (kernel/airfrans_convert.py keeps it), so the reader's contiguous block draw
# (subsample_n_points) kept one spatial window per case and draw: 100,000 contiguous rows of 156k to 210k, a
# largest near-field gap of about half a chord, and 66 to 75% of the airfoil's length with a drawn point within
# 0.01 chord (SAMPLING-AUDIT, 2026-10-14). Here the reader reads each case whole (no caps; the airfoil's 843 to
# 1,217 segments were read whole before as well) and SubsampleMesh, the first transform, keeps a uniform random
# ${sampling_resolution} interior points (a randperm draw). The interior carries no effective measure, so the
# loss and the metrics stay unweighted means over the drawn points, as before. Everything else is the source
# file's.
# AirfRANS (Bonnet et al., 2022) as a boundary-to-interior dataset, converted to native DomainMesh files by
# kernel/airfrans_convert.py (AIRFRANS-INT, 2026-09-21). Two-dimensional incompressible k-omega SST RANS around
# NACA airfoils at z = 0: interior = point cloud with velocity, pressure (kinematic), nut, sdf (positive outside)
# and sdf_normals; boundary "airfoil" = line cells with precomputed in-plane normals and segment lengths as the
# quadrature measure; global_data: U_inf, U_inf_dir, U_inf_mag, aoa_deg, Re, rho_inf = 1, p_inf = 0.
# Splits come from the dataset's manifest (full_train/full_test, scarce_train, reynolds_*, aoa_*); select with
# train_split=full_train val_split=full_test.
train_datadir: /scratch/fsw/portfolios/coreai/projects/coreai_modulus_cae/users/psharpe/datasets/airfrans_pdmsh
manifest: /scratch/fsw/portfolios/coreai/projects/coreai_modulus_cae/users/psharpe/datasets/airfrans_pdmsh/manifest.json

pipeline:
  reader:
    _target_: ${dp:DomainMeshReader}
    path: ${train_datadir}
    pattern: "airFoil2D_SST_*/*.pdmsh"
    # No reader caps: the interior (156k to 210k points) and the airfoil polyline are read whole; the
    # interior draw is the first transform's.
    drop_interior_cells: true
    drop_in_file_boundaries: false
  transforms:
    - _target_: ${dp:SubsampleMesh}   # AF-UNIFORM: a uniform random ${sampling_resolution} interior points, before anything reads them
      n_points: ${sampling_resolution}  # n_points reaches every sub-mesh: the airfoil (at most 1,217 points) is below it and kept whole
    - _target_: ${dp:NonDimensionalizeByMetadata}
      fields:
        velocity: velocity          # U / |U_inf|
        pressure: pressure          # (p - p_inf) / (0.5 rho_inf |U_inf|^2) with rho_inf = 1, p_inf = 0 (kinematic p)
        nut: identity
      association: point_data
    - _target_: ${dp:NormalizeMeshFields}
      association: point_data
      fields:
        nut: {type: scalar, mean: 7.9e-4, std: 2.4e-3}   # raw nut [m^2/s], mean and std over the converter per-case statistics (2026-09-21)
    - _target_: ${dp:SplitGlobalVector}   # DRIVE-FIX R1: standardized freestream speed for the baselines' global input
      field: U_inf_mag
      names: [U_inf_mag_std]
      mean: 62.116                      # full_train (800 cases) mean of global_data.U_inf_mag, m/s
      std: 17.914                       # full_train population std (ddof 0), m/s

targets:
  pressure: scalar
  nut: scalar
  velocity: vector
