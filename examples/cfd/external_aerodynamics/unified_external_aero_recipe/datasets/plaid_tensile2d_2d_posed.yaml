# CHAR-PROTOCOLS posed variant (2026-10-02): identical to plaid_tensile2d_2d.yaml except that every case
# is rigidly posed by a rotation and a translation that are a deterministic function of the case
# (a rotation uniform on SO(2) about the plane normal z; translation of one RMS point radius in a random
# direction in the plane),
# applied as the FIRST transform so geometry, normals, every vector field and the per-case global
# vectors move together and every architecture is scored on the same posed validation set.
# This pipeline has NO CenterMesh, so the translation reaches the model: the posed error measures rotation and
# translation together.
# Evaluation-only protocol: train natively, score the native checkpoint on this variant.

# PLAID Tensile2d in its native two dimensions (2026-10-02): plaid_tensile2d.yaml with RestrictToPlane first in the pipeline,
# so a model with a two-dimensional path (ISLA, `dim: 2`, conf/model/isla_tensile2d.yaml) sees d = 2 points, in-plane
# normals and SDF gradients, a two-component displacement target and line cells with segment lengths as the measure. The
# same data and the same normalization constants as plaid_tensile2d.yaml (the displacement mean loses its zero third
# component); the tensor-input baselines keep reading the three-coordinate form.
# PLAID Tensile2d (Safran, CC-BY-SA-4.0; HF PLAID-datasets/Tensile2d) as a boundary-to-interior solid-mechanics dataset,
# converted to native DomainMesh files by kernel/plaid_tensile2d_convert.py (2026-09-22). Two-dimensional quasi-static
# elasto-viscoplastic tension (plane strain, small deformations) embedded at z = 0: interior = every mesh node with
# displacement (U1, U2, 0), q (cumulated plastic strain), sig11 / sig22 / sig12 (stress, dataset units, MPa-scale), sdf
# (<= 0: the nodes are inside the solid, positive-outside convention) and sdf_normals (grad sdf); boundary "outer" = the
# closed outer polyline as line cells with outward in-plane normals, segment lengths as the quadrature measure, and per-cell
# BC labels bc_loaded (top edge, pressure P), bc_fixed (bottom edge, U2 = 0), bc_pinned (the BottomLeft node, U1 = 0),
# bc_pressure (= P on loaded cells, negative = tension) and traction (= -P n on loaded cells); global_data: P, p1..p5,
# params (6,). Only the 500 official training samples carry targets: the 200 test and 2 OOD samples ship without output
# fields and live under withheld/ (excluded by the pattern below). Splits: the official nested ladder train_8 ... train_500
# plus val_100 (seed-0 draw from train_500 minus train_250) and train_400 (= train_500 minus val_100); select with
# train_split=train_400 val_split=val_100 (or train_split=train_250 for the leaderboard-comparable ladder rung).
train_datadir: /scratch/fsw/portfolios/coreai/projects/coreai_modulus_cae/users/psharpe/datasets/plaid_tensile2d_pdmsh
manifest: /scratch/fsw/portfolios/coreai/projects/coreai_modulus_cae/users/psharpe/datasets/plaid_tensile2d_pdmsh/manifest.json

pipeline:
  reader:
    _target_: ${dp:CaseKeyDomainMeshReader}   # CHAR-PROTOCOLS posed: DomainMeshReader + the per-case `case_key` FixedRandomPose seeds from
    path: ${train_datadir}
    pattern: "sample_*/*.pdmsh"                  # excludes withheld/sample_*/ (no targets)
    subsample_n_points: ${sampling_resolution}   # interior queries (each case has 6k to 12k nodes: set sampling_resolution >= 12000 to keep every node)
    subsample_n_cells: ${sampling_resolution}    # larger than any case's ~500 boundary segments: the boundary is kept whole
    drop_interior_cells: true
    drop_in_file_boundaries: false
  transforms:
    - _target_: ${dp:FixedRandomPose}   # CHAR-PROTOCOLS posed: deterministic per-case pose, first so everything downstream sees it
      salt: 0
      translate: 1.0                    # one RMS point radius, drawn from the same keyed stream after the rotation
      axis: 2                           # planar problem stored at z = 0: rotate IN the plane only (SO(2) about z)
      symmetric_tensor_fields: [[sig11, sig22, sig12]]   # component-stored in-plane stress: rotated as sigma' = R sigma R^T, not as scalars
    - _target_: ${dp:RestrictToPlane}                  # first: everything after it is two-dimensional
      axis: 2
      vector_fields: [interior.point_data.sdf_normals, interior.point_data.displacement,
                      boundaries.outer.cell_data.normals, boundaries.outer.cell_data.traction]
    - _target_: ${dp:SplitGlobalVector}                # recipe-local (domain_transforms.py): global_data.params -> one standardized rank-0 leaf per
      field: params                                    # name (ISLA's global_schema) and the standardized vector params_std
      names: [P_std, p1_std, p2_std, p3_std, p4_std, p5_std]
      output_field: params_std
      mean: [-44.9989, 14.9429, 450.7845, 1502.57, 1496.48, 75434.75]   # zero mean / unit std over train_400; manifest _stats (2026-09-22)
      std: [2.8984, 2.8713, 86.0517, 286.0675, 289.1855, 14613.757]
    - _target_: ${dp:SqueezeScalarFields}              # the stored (N, 1) sdf column becomes the (N,) field a rank-0 schema reads
      fields: [interior.point_data.sdf]
    - _target_: ${dp:NormalizeMeshFields}
      association: cell_data
      fields:                                    # boundary input: the applied pressure P (train mean -45.0, std 2.9) to O(1);
        bc_pressure: {type: scalar, mean: 0.0, std: 45.0}   # scale only, so cells off the loaded edge stay exactly 0
    - _target_: ${dp:NormalizeMeshFields}
      association: point_data
      fields:                                    # pooled over all nodes of train_400 (manifest _stats; 2026-09-22)
        displacement: {type: vector, mean: [0.0, 0.0], std: 8.22e-4}   # EQ-NORM (2026-10-03): zero mean, one isotropic std; a non-zero vector mean breaks the posed protocol for every equivariant model
        q: {type: scalar, mean: 1.73e-7, std: 8.18e-6}       # heavy-tailed: 400-case max_q ranges 1.9e-7 .. 1.6e-3; consider a log1p transform
        sig11: {type: scalar, mean: 0.0, std: 37.837}   # EQ-NORM (2026-10-03): zero mean, one shared isotropic std for the stress tensor = sqrt(mean(sig11^2 + sig22^2 + 2 sig12^2)/4) over train_400
        sig22: {type: scalar, mean: 0.0, std: 37.837}
        sig12: {type: scalar, mean: 0.0, std: 37.837}

targets:
  q: scalar
  displacement: vector
  stress: {type: symmetric_tensor, components: {sig11: xx, sig22: yy, sig12: xy}}   # EQ-TENSOR (2026-10-03): ISLA predicts the in-plane stress as one symmetric rank-2 tensor; metric names sig11_l2 etc. unchanged
