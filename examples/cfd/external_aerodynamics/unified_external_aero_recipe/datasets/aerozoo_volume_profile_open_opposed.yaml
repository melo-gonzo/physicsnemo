# Statistics filled by fill_stats.py from stats_profile_open_opposed.train.json: split part profile_open_opposed.train, 2775 cases, 55,500,000 interior points (log10 Re mean 5.360, std 1.377).
# AeroZoo v1.2 (2026-10-09), interior task: boundary conditions on four grouped boundaries -> the RANS
# fields at the interior cell centroids. Native DomainMesh files (`shard-NNN/<case_id>/domain.pdmsh`,
# 3,816 released cases, dimensional SI, applied pose):
#   interior            : cell centroids (0.6M to 24M per case, no cells) with point_data.solution.*
#                         (velocity, gauge_pressure, turbulent_kinetic_energy, specific_dissipation_rate,
#                         turbulent_kinematic_viscosity, intermittency, momentum_thickness_reynolds_number)
#                         and point_data._target_quadrature_measure (cell volumes).
#   boundaries          : inlet / outlet / no_slip / slip, triangles (no stored normals or areas; the mesh
#                         computes them), all data in cell_data: solution.* on every boundary, the
#                         prescribed values under prescribed.dirichlet.* (inlet: velocity and the four
#                         turbulence quantities; outlet: gauge_pressure; no_slip: velocity = 0) and
#                         prescribed.reverse_flow.* (outlet), derived.{wall_shear_stress, wall_y_plus} and
#                         annotation.body_id on no_slip, annotation.body_id on slip. Face counts 23 to
#                         1.8M per role; a slip mesh can have 0 faces.
#   global_data         : physics.{density, kinematic_viscosity, body_acceleration, closure_model_id},
#                         reference.{velocity, speed, length, dynamic_pressure, force_projection_direction,
#                         secondary_inlet_velocities}, identity.*, solution_definition.*, diagnostics.*.
# Inputs are PDE data only: the prescribed values, the boundary roles, the freestream direction and the
# Reynolds number; body_id, solution.*, derived.*, identity and diagnostics are never inputs.
#
# The recipe reads the row-shuffled derived copy (datasets/aerozoo_v1.2_shuf_pdmsh), not the release,
# because the release stores the interior in OpenFOAM cell order, so the reader's contiguous block draw
# would be a spatial chunk (200,000 contiguous rows cover 8 to 42 percent of the domain box; after the
# random row permutation of kernel/aerozoo/aerozoo_shuffle.py, 97 to 99 percent).
#
# Splits: manifest.json written by results/campaigns_2026-10-09/aerozoo/build_manifest.py from the
# release's splits/splits.json and index.json, keys `<split>.<part>` (22 splits x train/val/test), e.g.
# train_split=geometry_holdout.train val_split=geometry_holdout.val.
