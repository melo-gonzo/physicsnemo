train_datadir: ${dataset_paths.aerozoo}
manifest: ${dataset_paths.aerozoo_manifest}

pipeline:
  reader:
    _target_: ${dp:DomainMeshReader}
    path: ${train_datadir}
    pattern: "shard-*/case-*/domain.pdmsh"
    subsample_n_points: ${sampling_resolution}   # interior queries (the recipe default 200,000; inference passes the same)
    # The reader caps EACH boundary independently, so the four roles give at most 4 x 50,000 = 200,000
    # boundary tokens per case (the inlet and outlet are usually far below the cap and kept whole; the
    # no_slip body and the slip walls are subsampled by cells, which records the inclusion probabilities
    # ComposeQuadratureMeasure folds into the corrected measure). A literal, not ${sampling_resolution},
    # so training and scoring see the same boundary budget at every interior resolution.
    subsample_n_cells: 50000
    boundary_subsample: cells
    # The interior is a point cloud already (no cells stored); the flag keeps the cheap contiguous
    # block read and is what drivaer_ml_volume_reference.yaml does.
    drop_interior_cells: true
    drop_in_file_boundaries: false
  transforms:
    # (a) The freestream scales under the names NonDimensionalizeByMetadata reads (U_inf, rho_inf,
    # L_ref, p_inf); the gauge pressure is relative to the freestream, so p_inf = 0 and `pressure` is Cp.
    - _target_: ${dp:RenameMeshFields}
      global_data:
        reference.velocity: U_inf
        physics.density: rho_inf
        reference.length: L_ref
    - _target_: ${dp:SetGlobalField}
      fields:
        p_inf: 0.0
    # (b) log10 Re = log10(U_ref L_ref / nu) as a raw leaf and standardized to O(1): the rank-0 global
    # input of both models (the cases span decades of Reynolds number).
    - _target_: ${dp:ComputeLogReynolds}
      speed_field: reference.speed
      length_field: L_ref
      viscosity_field: physics.kinematic_viscosity
      mean: 5.5
      std: 1.5
      output_field: log_re
      standardized_field: log_re_std
    # (c) Non-dimensionalize: interior targets (this instance also divides every mesh's coordinates by
    # L_ref), then the boundary cell_data with the same rules; intermittency and the momentum-thickness
    # Reynolds number are dimensionless.
    - _target_: ${dp:NonDimensionalizeByMetadata}
      association: point_data
      fields:
        solution.velocity: velocity
        solution.gauge_pressure: pressure
        solution.turbulent_kinematic_viscosity: kinematic_viscosity
        solution.turbulent_kinetic_energy: turbulent_kinetic_energy
        solution.specific_dissipation_rate: specific_dissipation_rate
    - _target_: ${dp:NonDimensionalizeByMetadata}
      association: cell_data
      scale_geometry: false
      fields:
        prescribed.dirichlet.velocity: velocity
        prescribed.reverse_flow.velocity: velocity
        prescribed.dirichlet.gauge_pressure: pressure
        prescribed.dirichlet.turbulent_kinetic_energy: turbulent_kinetic_energy
        prescribed.reverse_flow.turbulent_kinetic_energy: turbulent_kinetic_energy
        prescribed.dirichlet.specific_dissipation_rate: specific_dissipation_rate
        prescribed.reverse_flow.specific_dissipation_rate: specific_dissipation_rate
        derived.wall_shear_stress: stress
        solution.velocity: velocity
        solution.gauge_pressure: pressure
        solution.turbulent_kinematic_viscosity: kinematic_viscosity
        solution.turbulent_kinetic_energy: turbulent_kinetic_energy
        solution.specific_dissipation_rate: specific_dissipation_rate
    # (d) Centre on the mean of the interior sample, as drivaer_ml_volume_reference.yaml does
    # (use_area_weighting: false); DomainMesh.translate moves the four boundaries with the interior.
    - _target_: ${dp:CenterMesh}
      use_area_weighting: false
    # (e) The unit freestream direction, the rank-1 global input; U_inf itself stays physical for
    # re-dimensionalization.
    - _target_: ${dp:ComputeFreestreamDirection}
      velocity_field: U_inf
      output_field: U_inf_dir
    # (f) One boundary grammar for the four roles: a one-hot role label on every boundary and a
    # zero-filled copy of every prescribed field a boundary lacks (a 0-face slip mesh gets zero rows), so
    # one declaration reads all four (ISLA declares each condition's own fields and drops this step). Renamed below.
    - _target_: ${dp:HarmonizeBoundaryFields}
      one_hot:
        inlet: bc_inlet
        outlet: bc_outlet
        no_slip: bc_no_slip
        slip: bc_slip
      fields:                                   # {cell_data field: rank}
        prescribed.dirichlet.velocity: 1
        prescribed.reverse_flow.velocity: 1
        prescribed.dirichlet.gauge_pressure: 0
        prescribed.dirichlet.turbulent_kinetic_energy: 0
        prescribed.dirichlet.specific_dissipation_rate: 0
        prescribed.dirichlet.intermittency: 0
        prescribed.dirichlet.momentum_thickness_reynolds_number: 0
        prescribed.reverse_flow.turbulent_kinetic_energy: 0
        prescribed.reverse_flow.specific_dissipation_rate: 0
        prescribed.reverse_flow.intermittency: 0
        prescribed.reverse_flow.momentum_thickness_reynolds_number: 0
    # The inlet's prescribed turbulence (nondimensional k and omega, intermittency, Re_theta_t) reduced
    # to four per-case globals (area-weighted mean over the inlet faces; the values are uniform, so the
    # mean is exact), standardized over the train split as SplitGlobalVector does for the lug's
    # parameters: ISLA declares the four `*_std` leaves, GeoTransolver reads them inside `global_vector`
    # = [U_inf_dir (3), log_re_std (1), inlet_turbulence_std (4)], so both models see the same global
    # information.
    - _target_: ${dp:BoundaryFieldToGlobal}
      boundary: inlet
      fields:
        prescribed.dirichlet.turbulent_kinetic_energy: inlet_tke
        prescribed.dirichlet.specific_dissipation_rate: inlet_omega
        prescribed.dirichlet.intermittency: inlet_intermittency
        prescribed.dirichlet.momentum_thickness_reynolds_number: inlet_retheta
    - _target_: ${dp:ConcatGlobalFields}
      fields: [inlet_tke, inlet_omega, inlet_intermittency, inlet_retheta]
      output_field: inlet_turbulence
    - _target_: ${dp:SplitGlobalVector}
      field: inlet_turbulence
      names: [inlet_tke_std, inlet_omega_std, inlet_intermittency_std, inlet_retheta_std]
      # PLACEHOLDERS: per-case mean / std over the train split, from
      # results/campaigns_2026-10-09/aerozoo/aerozoo_stats.py --reduce (`inlet_globals` block).
      # A quantity that is constant over the split (intermittency = 1) gets std 1.0.
      mean: [0.00260769, 1.54997, 1, 343.002]
      std: [0.00369493, 2.59168, 1, 259.045]
      output_field: inlet_turbulence_std
    - _target_: ${dp:ConcatGlobalFields}
      fields: [U_inf_dir, log_re_std, inlet_turbulence_std]
      output_field: global_vector             # GeoTransolver's global_embedding (8)
    - _target_: ${dp:RenameMeshFields}
      cell_data:
        prescribed.dirichlet.velocity: bc_velocity
        prescribed.reverse_flow.velocity: bc_velocity_reverse
        prescribed.dirichlet.gauge_pressure: bc_pressure
        prescribed.dirichlet.turbulent_kinetic_energy: bc_tke
        prescribed.dirichlet.specific_dissipation_rate: bc_omega
        prescribed.dirichlet.intermittency: bc_intermittency
        prescribed.dirichlet.momentum_thickness_reynolds_number: bc_retheta
        prescribed.reverse_flow.turbulent_kinetic_energy: bc_tke_reverse
        prescribed.reverse_flow.specific_dissipation_rate: bc_omega_reverse
        prescribed.reverse_flow.intermittency: bc_intermittency_reverse
        prescribed.reverse_flow.momentum_thickness_reynolds_number: bc_retheta_reverse
    # (g) Signed distances for GeoTransolver's local embedding (ISLA computes its own geometry from the
    # boundary surface and declares no query_schema). Pseudo-normal sign from the fast nearest-triangle
    # kernel, no winding-number pass: the body is closed and the slip walls are planar. Both are computed
    # from the boundary as the reader hands it over (the 50,000-face subsample on bodies above the cap).
    - _target_: ${dp:ComputeSDFFromBoundary}
      boundary_name: no_slip
      sdf_field: sdf_wall
      normals_field: sdf_wall_normals
      use_winding_number: false
    # A case without slip walls (0 faces) gets sdf_slip = the diagonal of the interior's bounding box
    # (the distance to a wall beyond the domain, positive like the outside of a wall).
    - _target_: ${dp:ComputeSDFFromBoundary}
      boundary_name: slip
      sdf_field: sdf_slip
      normals_field: null
      use_winding_number: false
      allow_empty_boundary: true
    # (g') The four boundaries are stored with their normals out of the fluid (the OpenFOAM convention; the
    # release's schema, pdmsh-schema-v5, uses n "pointing out of the fluid" in its force integral). Reverse
    # them so their normals point into the fluid, as AirfRANS's airfoil and the reoriented DrivAerML vehicle
    # do: ISLA's built-in signed distance is positive on the side the normals point to, so positive in the
    # fluid. After the SDF passes, so GeoTransolver's stored distances are those of the stored files.
    - _target_: ${dp:FlipBoundaryOrientation}
      boundaries: [inlet, outlet, no_slip, slip]
    # (h) The five targets under their recipe names; intermittency and Re_theta_t are not predicted.
    - _target_: ${dp:RenameMeshFields}
      point_data:
        solution.velocity: velocity
        solution.gauge_pressure: pressure
        solution.turbulent_kinematic_viscosity: nut
        solution.turbulent_kinetic_energy: tke
        solution.specific_dissipation_rate: omega
    - _target_: ${dp:DropMeshFields}
      point_data: [solution.intermittency, solution.momentum_thickness_reynolds_number]
    # (i) Standardize the targets. PLACEHOLDERS: pooled over a seeded 20,000-point interior sample per
    # train case, from results/campaigns_2026-10-09/aerozoo/aerozoo_stats.py --reduce; velocity's std is
    # the isotropic (Frobenius / sqrt(3)) value, per the recipe's vector convention.
    - _target_: ${dp:NormalizeMeshFields}
      association: point_data
      fields:
        velocity: {type: vector, mean: [-0.00770558, 0.0150789, -0.0224653], std: 0.784146}
        pressure: {type: scalar, mean: 1.7332, std: 4.27625}
        nut: {type: scalar, mean: 0.0029809, std: 0.00830872}
        tke: {type: scalar, mean: 0.0122478, std: 0.0403714}
        omega: {type: scalar, mean: 113.667, std: 1571.73}
    # (j) Last in the chain: the corrected measure on the boundary cells the model will see. The
    # interior is a point cloud without `_effective_measure` (its `_target_quadrature_measure`, the cell
    # volumes, is not the recipe's measure key and stays an inert leaf), so extract_target_measure
    # returns None and the loss and metrics are unweighted means over the sampled points, exactly the
    # DrivAerML Volume wiring.
    - _target_: ${dp:ComposeQuadratureMeasure}

targets:
  velocity: vector
  pressure: scalar
  nut: scalar
  tke: scalar
  omega: scalar
