# FRAME-AF local mechanism rung (2026-09-23): a 160-case AirfRANS subset converted locally (120 scarce_train cases, 40 full_test
# cases; manifest splits local_train / local_test), same pipeline as the cluster's airfrans_volume.yaml. Exploration-scale
# instrument on a laptop GPU: no accuracy claim, mechanism only (STYLE: labeled rung).
train_datadir: /home/psharpe/data/airfrans_local_pdmsh
manifest: /home/psharpe/data/airfrans_local_pdmsh/manifest.json

pipeline:
  reader:
    _target_: ${dp:DomainMeshReader}
    path: ${train_datadir}
    pattern: "airFoil2D_SST_*/*.pdmsh"
    subsample_n_points: ${sampling_resolution}   # interior queries (each case has ~177k points)
    subsample_n_cells: ${sampling_resolution}    # larger than any airfoil's ~1,000 segments: the boundary is kept whole
    drop_interior_cells: true
    drop_in_file_boundaries: false
  transforms:
    - _target_: ${dp:NonDimensionalizeByMetadata}
      fields:
        velocity: velocity
        pressure: pressure
        nut: identity
      association: point_data
    - _target_: ${dp:NormalizeMeshFields}
      association: point_data
      fields:
        nut: {type: scalar, mean: 7.9e-4, std: 2.4e-3}

targets:
  pressure: scalar
  nut: scalar
  velocity: vector
