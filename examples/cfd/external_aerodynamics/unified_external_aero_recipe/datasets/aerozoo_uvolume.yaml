train_datadir: ${dataset_paths.aerozoo}
manifest: ${dataset_paths.aerozoo_manifest}
sample_filter:
  global_data: diagnostics.solve.solution_quality_id
  keep: [4]

pipeline:
  reader:
    _target_: ${dp:DomainMeshReader}
    path: ${train_datadir}
    pattern: "shard-*/case-*/domain.pdmsh"
    subsample_n_points: ${sampling_resolution}   # interior queries (the recipe default 200,000; inference passes the same)
    boundary_subsample: cells
    drop_interior_cells: true
    drop_in_file_boundaries: false
  transforms:
    # A uniform random 50,000 faces per boundary, with the Horvitz-Thompson measure N/k: a literal, so training
    # and scoring see the same boundary budget at every interior resolution.
    - _target_: ${dp:SubsampleMesh}
      n_cells: 50000
    # One boundary grammar for the four roles: a one-hot role label and a zero-filled copy of every prescribed
    # field a boundary lacks (ISLA declares each condition's own fields and drops this step and the merge).
    - _target_: ${dp:HarmonizeBoundaryFields}
      one_hot:
        inlet: bc_inlet
        outlet: bc_outlet
        no_slip: bc_no_slip
        slip: bc_slip
      fields:                                   # {cell_data field: rank}
        prescribed.dirichlet.velocity: 1
        prescribed.reverse_flow.velocity: 1
        prescribed.dirichlet.gauge_pressure: 0
        prescribed.dirichlet.turbulent_kinetic_energy: 0
        prescribed.dirichlet.specific_dissipation_rate: 0
        prescribed.dirichlet.intermittency: 0
        prescribed.dirichlet.momentum_thickness_reynolds_number: 0
        prescribed.reverse_flow.turbulent_kinetic_energy: 0
        prescribed.reverse_flow.specific_dissipation_rate: 0
        prescribed.reverse_flow.intermittency: 0
        prescribed.reverse_flow.momentum_thickness_reynolds_number: 0
    # The prescribed values under their recipe names, in SI units.
    - _target_: ${dp:RenameMeshFields}
      cell_data:
        prescribed.dirichlet.velocity: bc_velocity
        prescribed.reverse_flow.velocity: bc_velocity_reverse
        prescribed.dirichlet.gauge_pressure: bc_pressure
        prescribed.dirichlet.turbulent_kinetic_energy: bc_tke
        prescribed.dirichlet.specific_dissipation_rate: bc_omega
        prescribed.dirichlet.intermittency: bc_intermittency
        prescribed.dirichlet.momentum_thickness_reynolds_number: bc_retheta
        prescribed.reverse_flow.turbulent_kinetic_energy: bc_tke_reverse
        prescribed.reverse_flow.specific_dissipation_rate: bc_omega_reverse
        prescribed.reverse_flow.intermittency: bc_intermittency_reverse
        prescribed.reverse_flow.momentum_thickness_reynolds_number: bc_retheta_reverse
    # The signed distance and its gradient to the no_slip body in metres, the baselines' published body-SDF
    # input (pseudo-normal sign, no winding-number pass; computed on the stored orientation, before the flip).
    - _target_: ${dp:ComputeSDFFromBoundary}
      boundary_name: no_slip
      sdf_field: sdf_wall
      normals_field: sdf_wall_normals
      use_winding_number: false
    # log10 of the kinematic viscosity, standardized by per-dataset constants (the mean and std of log10 nu
    # over the training cases): one fixed map, the baselines' global input.
    - _target_: ${dp:StandardizeGlobalLeaf}
      field: physics.kinematic_viscosity
      output_field: nu_std
      log10: true
      mean: -4.96355
      std: 1.80669
    # The four boundaries are stored with their normals out of the fluid (OpenFOAM's convention); reversed so
    # they point into the fluid, as AirfRANS's airfoil and the reoriented DrivAerML vehicle do (ISLA's signed
    # distance is positive on the side the normals point to). After the SDF pass, so the stored distances are
    # those of the stored files.
    - _target_: ${dp:FlipBoundaryOrientation}
      boundaries: [inlet, outlet, no_slip, slip]
    - _target_: ${dp:RenameMeshFields}
      point_data:
        solution.velocity: velocity
        solution.gauge_pressure: pressure
        solution.turbulent_kinematic_viscosity: nut
        solution.turbulent_kinetic_energy: tke
        solution.specific_dissipation_rate: omega
        solution.intermittency: intermittency
        solution.momentum_thickness_reynolds_number: retheta
    # Physical targets, one standardization per dataset, scale only: mean 0 and the RMS about 0 of a seeded
    # 20,000-point interior sample per mean_stable training case as the std (velocity: the isotropic one), the
    # same for every model. Not the pooled mean (2026-10-19): the targets span decades across cases, and on
    # full.train the pooled pressure mean is 201 Pa against a std of 1,129 Pa, so a case whose RMS pressure is
    # ~0.03 Pa would read -0.18 plus a signal of ~3e-5, below bf16's step near 0.18 (~7e-4, the baselines'
    # head under autocast) and at ~5e-4 relative in float32; nut, tke and omega have mean / std 0.02-0.13.
    # intermittency and retheta (Re_theta_t), both dimensionless: the same rule, from aerozoo_pstats.py targets
    # (LHR cpu-short job 397199, 2026-10-26; the five other fields' sample lines reproduce those of 2026-10-09).
    # Refit on the mean_stable train cases from the same sample lines (aerozoo_pstats.py reduce, 2026-10-26).
    # Scale only, every value keeps its own floating-point relative precision.
    - _target_: ${dp:NormalizeMeshFields}
      association: point_data
      fields:
        velocity: {type: vector, mean: [0, 0, 0], std: 12.0207}
        pressure: {type: scalar, mean: 0, std: 1197.55}
        nut: {type: scalar, mean: 0, std: 0.456675}
        tke: {type: scalar, mean: 0, std: 20.336}
        omega: {type: scalar, mean: 0, std: 422997}
        intermittency: {type: scalar, mean: 0, std: 0.958797}
        retheta: {type: scalar, mean: 0, std: 406.074}
    - _target_: ${dp:ComposeQuadratureMeasure}
    # Last: every boundary face as one token set (boundaries.merged), each with its condition type (one-hot)
    # and its prescribed values: GeoTransolver's geometry. The values are standardized here only, by
    # per-dataset constants pooled over the training cases' expected tokens, scale only like the targets (mean
    # 0, the RMS about 0 as the std; vectors the isotropic one; the all-zero gauge outlet pressure 1): with the
    # pooled means (full.train bc_tke 0.134 m^2/s^2 over a std of 1.10) a slow case's inlet k of ~1e-4 read
    # -0.1213 against -0.1214 on the zero-filled faces, below bf16's step there (~5e-4), so the model could not
    # tell it from zero (2026-10-19). The four source boundaries keep their SI values. The face
    # positions stay raw, like the queries.
    - _target_: ${dp:MergeBoundaries}
      boundaries: [inlet, outlet, no_slip, slip]
      output: merged
      fields: [bc_inlet, bc_outlet, bc_no_slip, bc_slip, bc_velocity, bc_velocity_reverse, bc_pressure, bc_tke,
               bc_omega, bc_intermittency, bc_retheta, bc_tke_reverse, bc_omega_reverse, bc_intermittency_reverse,
               bc_retheta_reverse]
      standardize:
        bc_velocity: {type: vector, mean: [0, 0, 0], std: 4.25653}
        bc_velocity_reverse: {type: vector, mean: [0, 0, 0], std: 4.57757}
        bc_pressure: {type: scalar, mean: 0, std: 1}
        bc_tke: {type: scalar, mean: 0, std: 1.19621}
        bc_omega: {type: scalar, mean: 0, std: 398.936}
        bc_intermittency: {type: scalar, mean: 0, std: 0.475521}
        bc_retheta: {type: scalar, mean: 0, std: 196.988}
        bc_tke_reverse: {type: scalar, mean: 0, std: 1.27757}
        bc_omega_reverse: {type: scalar, mean: 0, std: 416.505}
        bc_intermittency_reverse: {type: scalar, mean: 0, std: 0.526748}
        bc_retheta_reverse: {type: scalar, mean: 0, std: 218.719}

targets:
  velocity: vector
  pressure: scalar
  nut: scalar
  tke: scalar
  omega: scalar
  intermittency: scalar
  retheta: scalar

# ISLA's own constants for this split: conf/model/isla_volume_aerozoo.yaml leaves them null and train.py / infer.py
# inject them. Fitted on full.train's 2,011 mean_stable cases (of 2,713) with the implemented scale functions
# (ISLA._gauge and ISLA._case_scales on the full-resolution boundaries): reynolds is the mean and the population std
# over the train cases of log10(U L / nu); output_scale is, per output, the median over the train cases of the per-case
# RMS of the target made dimensionless by its units (a seeded 20,000-point interior sample per case; velocity's the
# isotropic RMS), and input_scale, per boundary input, the median over the train cases of the per-case area-weighted
# RMS of the input made dimensionless by its units (a vector's of its magnitude): robust typical sizes, where the
# pooled RMS is set by the few largest cases. Per-case rows: LHR cpu-short jobs 407910-407911, 2026-10-26
# (examples/cfd/isla/results/aerozoo_dataset/isla_constants_fit.py aerozoo on ISLA 0.9.0, code 92d9d7800, as the
# 2026-10-20 fit, jobs 295774-295776, whose constants they reproduce on every train case), fitted by its summarize
# on the mean_stable train cases (aerozoo_mean_stable_constants_fits.json).
# intermittency and retheta are dimensionless, so their scale is the median per-case RMS itself, on the same
# seeded sample: LHR cpu-short job 397200 (isla_constants_fit.py aerozoo_rms), 2026-10-26, fitted the same way.
isla_constants:
  reynolds: {mean: 5.849, std: 1.444}
  output_scale: {velocity: 0.5763, pressure: 0.07811, nut: 0.0004471, tke: 0.00853, omega: 608.3, intermittency: 0.9993, retheta: 222.8}
  input_scale:
    inlet: {bc_intermittency: 1, bc_omega: 1.677, bc_retheta: 219.6, bc_tke: 0.0008784}
    outlet: {bc_intermittency_reverse: 1, bc_omega_reverse: 1.631, bc_retheta_reverse: 219.6, bc_tke_reverse: 0.0007741, bc_velocity_reverse: 1}
