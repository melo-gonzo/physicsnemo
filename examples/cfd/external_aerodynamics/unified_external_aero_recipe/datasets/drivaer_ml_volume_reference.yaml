# DrivaerML volume dataset (DomainMesh)
# Loads domain_*.pdmsh files containing interior volume mesh + vehicle boundary + global_data.
# Interior: tetrahedral volume mesh with fields in point_data.
# Boundary: triangulated car-body surface mesh keyed `vehicle` (curated layout).
# global_data: freestream conditions (U_inf, rho_inf, p_inf, nu, L_ref) are
# embedded directly in the .pdmsh files and read straight out of each sample's
# global_data by NonDimensionalizeByMetadata.
# Splits are controlled by manifest.json + train_split/val_split in the training config.

train_datadir: ${dataset_paths.drivaer_ml}

pipeline:
  reader:
    _target_: ${dp:DomainMeshReader}
    path: ${train_datadir}
    pattern: "run_*/domain_*.pdmsh"
    subsample_n_points: ${sampling_resolution}
    # No subsample_n_cells: the vehicle is read whole. boundary_subsample:
    # cells keeps the interior's point cap off the boundaries (a point cut of
    # the triangulated surface would keep only cells whose three vertices all
    # survive it); the interior is a point cloud and is unaffected.
    boundary_subsample: cells
    # The volume model consumes the interior as a point cloud (interior.points +
    # interior.point_data); dropping interior tet topology makes the point
    # subsample a cheap contiguous block read instead of a full slice_points
    # remap (the dominant per-sample IO cost otherwise).
    drop_interior_cells: true
    # Preserve in-file boundaries as the lossless default. Point-based model
    # templates that consume only the interior explicitly opt into dropping
    # them to skip per-sample subsampling (expensive, GIL-held) and pinning.
    drop_in_file_boundaries: false
    extra_boundaries:
      stl_geometry:
        pattern: "*_single_solid.stl.pmsh"
  augmentations:
    - _target_: ${dp:RandomRotateMesh}
      axes: ["z"]
      transform_point_data: true
      transform_global_data: true
    - _target_: ${dp:RandomTranslateMesh}
      distribution:
        _target_: torch.distributions.Uniform
        low:
          _target_: torch.tensor
          data: [-1.0, -1.0, 0.0]
        high:
          _target_: torch.tensor
          data: [1.0, 1.0, 0.0]
  transforms:
    - _target_: ${dp:DropMeshFields}
      global_data: [TimeValue]
    - _target_: ${dp:CenterMesh}
      use_area_weighting: false
    # The unit freestream direction is ISLA's global vector input
    # (isla_volume.yaml reads global_data.U_inf_dir); U_inf itself stays
    # physical for re-dimensionalization.
    - _target_: ${dp:ComputeFreestreamDirection}
      velocity_field: U_inf
      output_field: U_inf_dir
    - _target_: ${dp:NonDimensionalizeByMetadata}
      fields:
        UMeanTrim: velocity
        pMeanTrim: pressure
        nutMeanTrim: identity
      association: point_data
    - _target_: ${dp:ComputeSDFFromBoundary}
      boundary_name: stl_geometry
      sdf_field: sdf
      normals_field: sdf_normals
      # Pseudo-normal sign (fed by the fast nearest-triangle kernel). The
      # _single_solid STL is watertight, so this is exact and avoids the
      # O(n_points * n_faces) winding-number sign pass.
      use_winding_number: false
    - _target_: ${dp:DropBoundary}
      names: [stl_geometry]
    # ISLA's signed distance is positive on the side the boundary normals point
    # to; the stored vehicle cells are wound into the body (signed volume
    # -6.3 to -8.0 m^3), so reverse them: the normals then point into the fluid
    # and the distance is positive there, as on AirfRANS and AeroZoo.
    - _target_: ${dp:FlipBoundaryOrientation}
      boundaries: [vehicle]
    - _target_: ${dp:RenameMeshFields}
      point_data:
        UMeanTrim: velocity
        pMeanTrim: pressure
        nutMeanTrim: nut
    - _target_: ${dp:NormalizeMeshFields}
      association: point_data
      fields:
        nut: {type: scalar, mean: 4.8e-4, std: 9.4e-4}
    # No terminal MeshToTensorDict / RestructureTensorDict: the volume YAML
    # already produces a DomainMesh natively (interior = volume mesh with
    # target fields in point_data; boundaries = {"vehicle": car body}).
    # The recipe's collate consumes the DomainMesh directly using each
    # model YAML's `forward_kwargs:` spec. Targets are extracted from
    # interior.point_data.<name> by the `targets:` block below.

    # Last in the chain: the cell measure on the cells the model will see.
    - _target_: ${dp:ComposeQuadratureMeasure}
targets:
  velocity: vector
  pressure: scalar
  nut: scalar
