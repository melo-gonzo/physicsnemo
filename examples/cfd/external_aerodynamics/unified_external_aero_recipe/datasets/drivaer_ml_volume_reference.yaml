# Reference interior dataset (2026-09-14) for conf/model/isla_volume.yaml:
# drivaer_ml_volume.yaml with the vehicle boundary read whole (ISLA takes the
# full-resolution surface and draws its boundary tokens inside the model, so no
# boundary cell cap here), reoriented so its normals point into the fluid
# (FlipBoundaryOrientation: the stored vehicle cells are wound into the body),
# and ComposeQuadratureMeasure, which materializes the cell measure ISLA reads
# as boundaries.vehicle.cell_data._effective_measure.
