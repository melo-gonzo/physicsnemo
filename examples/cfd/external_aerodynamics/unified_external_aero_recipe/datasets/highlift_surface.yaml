# High-lift airplane surface dataset (compressible, cell-centric)
# Reads the boundary surface Mesh directly from DomainMesh .pdmsh files
# by navigating into the on-disk tensordict directory structure.
# Boundary mesh from HiLiftAeroML. Physics fields live in cell_data
# (derived from vertex-projected point_data during conversion).
# Model inputs use cell centroids and face normals; topology (triangles)
# is preserved for normal computation and cell-based subsampling.
# global_data: the boundary tensordict's own global_data is empty; the
# per-case freestream conditions (U_inf, p_inf, rho_inf, T_inf, L_ref)
# live on the parent DomainMesh's _tensordict/global_data, so we use
# MeshReaderWithGlobalData to merge them onto each boundary Mesh at load
# time. Units are slug-inch-second-Rankine.
# Splits are controlled by manifest.json + train_split/val_split in the training config.

train_datadir: ${dataset_paths.highlift_aero_ml}
# manifest: <path to a {train, val} manifest JSON built from the dataset-root
#           manifest's curated split lists (e.g. full_train / full_val)>

# The hemisphere of the PDE domain's far field, given to both AddSymmetryPlane (its equator) and
# AddHemisphereBoundaries (its inlet and outlet) from here, so the plane's seam is theirs bit for bit.
hemisphere:
  radius: 24533.41796875
  n_theta: 64
  n_phi: 32

pipeline:
  reader:
    _target_: ${dp:MeshReaderWithGlobalData}
    path: ${train_datadir}
    pattern: "geo_LHC*/*.pdmsh/_tensordict/boundaries/vehicle"
    subsample_n_cells: ${sampling_resolution}
    # Walk up two levels from the boundary tensordict to the parent
    # DomainMesh's global_data and merge its keys onto each sample.
    merge_global_data_from: "../../global_data"
    # The stored wings repeat about 25,700 root cells about 18.9 M times (about 46 % of the summed
    # wing area); drop the extra copies, using the cached masks of tools/build_duplicate_masks.py
    # (checked against each case's connectivity at every load). See src/dedup.py.
    drop_duplicate_cells: true
    duplicate_cell_masks: ${dataset_paths.highlift_aero_ml_duplicate_masks}
    # The symmetry plane y = 0, the third boundary of the PDE domain, which no case file stores:
    # the hemisphere's equatorial disk minus the wing's root section, whose outline is the closed
    # root cap of the dataset's own source STL (the first geo_*/*.stl.pmsh, accepted only with one
    # of the two cap keys below; Peter's ruling of 2026-10-24). Built in the reader from the whole
    # stored wing, in raw inches, for each case whose own stored root lies on that outline (every
    # on-plane vertex and open edge within the tolerance derived in src/symmetry.py), as the record
    # of tools/build_symmetry_check.py states (checked against each case's fingerprints at every
    # load); a case that fails gets no plane, logged. See AddSymmetryPlane.
    whole_surface_transforms:
      - _target_: ${dp:AddSymmetryPlane}
        radius: ${hemisphere.radius}
        n_theta: ${hemisphere.n_theta}
        n_phi: ${hemisphere.n_phi}
        cap_root: ${train_datadir}
        cap_md5: [d3b5c68bdac50aa7c0cc688443795dc2, 480578a2e673fc572e0b2d3194442721]
        check_record: ${dataset_paths.highlift_aero_ml_symmetry_check}
  augmentations:
    - _target_: ${dp:RandomRotateMesh}
      axes: ["z"]
      mode: axis_aligned
      transform_point_data: true
      transform_cell_data: true
      transform_global_data: true
    - _target_: ${dp:RandomTranslateMesh}
      distribution:
        _target_: torch.distributions.Uniform
        low:
          _target_: torch.tensor
          data: [-1.0, -1.0, 0.0]
        high:
          _target_: torch.tensor
          data: [1.0, 1.0, 0.0]
  transforms:
    # The far field of the PDE domain, which 1,798 of the 1,800 case files do not store: the
    # hemisphere of radius 24,533.41796875 in (88.95 MAC) about the raw origin, split into inlet
    # and outlet by the case's own stored U_inf, as physicsnemo-curator's HemisphereBoundaries
    # wrote it for the two files that store it (LHC001_AoA_10, _12), whose inlet and outlet it
    # reproduces bit for bit. The radius is the stored data's: the pole of those two files, and
    # the extent along x and z, to the float32 bit, of every interior the dataset stores (13 files,
    # of LHC001 and LHC002; the CFD far field's own nodes reach 1.0188 times it, 90.6 MAC, between
    # those axes; the paper says about 75 MAC). n_theta 64 and n_phi 32 are the divisions curator
    # wrote them with. Every case of an angle of attack stores the same U_inf, bit for bit, so the
    # 1,800 cases have 10 far fields, each equal to curator's own. Built first, in the
    # files' raw inches, so every transform and pose below moves it with the wing. The symmetry
    # plane y = 0 is built in the reader (AddSymmetryPlane above), beside the wing, so the same
    # transforms move it. Models that read only `interior` and `boundaries.vehicle` see what they
    # saw before.
    - _target_: ${dp:AddHemisphereBoundaries}
      radius: ${hemisphere.radius}
      n_theta: ${hemisphere.n_theta}
      n_phi: ${hemisphere.n_phi}
    # Unit freestream direction as a NEW global leaf U_inf_dir (U_inf stays
    # physical). Consumed as the unit global vector input by ISLA
    # (global_schema: U_inf_dir); inert for models that do not declare it.
    # Mirrors drivaer_ml_surface.yaml; placed before CenterMesh so the
    # rotation augmentation rotates it together with U_inf and the geometry.
    - _target_: ${dp:ComputeFreestreamDirection}
      velocity_field: U_inf
      output_field: U_inf_dir
    - _target_: ${dp:CenterMesh}
      use_area_weighting: false
    - _target_: ${dp:ComputeSurfaceNormals}
      store_as: cell_data
      field_name: normals
    - _target_: ${dp:NonDimensionalizeByMetadata}
      fields:
        PROJ(AVG(P)): pressure
        PROJ(AVG(T)): temperature
        PROJ(AVG(RHO)): density
        PROJ(AVG(U)): velocity
        AVG(TAU_WALL): stress
      association: cell_data
    - _target_: ${dp:RenameMeshFields}
      cell_data:
        PROJ(AVG(P)): pressure
        PROJ(AVG(T)): temperature
        PROJ(AVG(RHO)): density
        PROJ(AVG(U)): velocity
        AVG(TAU_WALL): tau_wall
    # z-score normalization (dataset-wide stats)
    # Stats are post-nondimensionalization values.
    # TODO: recompute stats for cell-centered data (these are vertex-projected estimates)
    - _target_: ${dp:NormalizeMeshFields}
      association: cell_data
      fields:
        pressure:    {type: scalar, mean: -0.5,  std: 1.0}
        temperature: {type: scalar, mean:  1.00, std: 0.002}
        density:     {type: scalar, mean:  1.0, std: 0.02}
        velocity:    {type: vector, mean: [0.00, 0.00, 0.00], std: 0.20}
        tau_wall:    {type: scalar, mean: [0.00, 0.00, 0.00], std: 0.003}
    # Terminal: convert the surface into the DomainMesh of the recipe contract, beside the
    # far field. cell_data_targets are auto-injected from the `targets:` block.
    - _target_: ${dp:SurfaceMeshToDomainMesh}
      interior_points: cell_centroids

targets:
  pressure: scalar
  temperature: scalar
  density: scalar
  velocity: vector
  tau_wall: vector
