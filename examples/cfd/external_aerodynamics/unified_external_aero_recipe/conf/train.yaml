# ---------------------------------------------------------------------------
# Unified External Aerodynamics -- canonical training entry point.
# ---------------------------------------------------------------------------
# Picks one model template and one dataset, applies the centralized
# training schedule below, and runs the loop.  Every previously-named
# recipe (FA variants, GLOBE, multi-dataset Transolver, HiLift) is
# reproducible from CLI overrides; see the Recipe Gallery in README.md.
#
#   Default invocation:
#     python src/train.py
#
#   Pick a different model + dataset:
#     python src/train.py model=transolver_volume dataset=drivaer_ml_volume
#
#   Multi-dataset:
#     python src/train.py model=transolver_surface dataset=drivaer_ml_surface \
#         'extra_datasets=[shift_suv_estate_surface, shift_suv_fastback_surface]'
### `_self_` merges before the model template, so model templates may
### carry known-good per-model overrides of the schedule below (e.g.
### `compile`, `training.optimizer.lr`). CLI overrides still win over both.
defaults:
  - base
  - _self_
  - model: geotransolver_volume

# -- Dataset selection -------------------------------------------------------
# A string naming a file in datasets/ (without the `.yaml` suffix).
dataset: drivaer_ml_volume

# Additional datasets to combine via MultiDataset. Each entry names a
# file in datasets/. Manifest selections are offset into the combined
# index space independently for every chosen dataset.
extra_datasets: []

# Manifest-mode split selectors.  Setting these requests manifest mode:
# a dataset without a locatable manifest raises at startup.  For a
# manifest-less (directory-mode) dataset set `train_split=null
# val_split=null`.
train_split: train
val_split: val

# -- Recipe-side dataset overrides (applied at pipeline-build time) ---------
# Caps the SubsampleMesh `n_cells` / `n_points` across every chosen
# dataset's pipeline (resolved as `${sampling_resolution}` inside each
# dataset YAML).
sampling_resolution: 200000

# Subset of metrics the MetricCalculator will log.  Used to be declared
# per-dataset; now lives recipe-side because the choice is a recipe
# decision, not a dataset property.
metrics: [l2]

# -- Run identity -----------------------------------------------------------
# `${hydra:runtime.choices.model}` is the model template the user
# composed; `${dataset}` is the dataset string above.  Override on the
# CLI for a stable / repeatable run name.
run_id: "${hydra:runtime.choices.model}__${dataset}__${now:%Y%m%d_%H%M%S}"

output_dir: "runs"
checkpoint_dir: null
compile: true
# Keyword arguments of torch.compile(model, ...) when `compile` is true (e.g.
# fullgraph, dynamic, mode); empty = PyTorch's defaults. A model template may
# set them (the ISLA templates do; see isla_volume.yaml).
compile_options: {}

# -- Training schedule ------------------------------------------------------
# Defaults match the GeoTransolver recipes (the most common case).
# Override on the CLI per recipe (see README's Recipe Gallery for
# Transolver / FLARE / GLOBE / HiLift / DoMINO invocations).
training:
  num_epochs: 500
  # Checkpoint retention (physicsnemo.utils.CheckpointManager): the latest epoch, every save_interval-th, and the
  # keep_best epochs with the lowest validation loss in checkpoints/best/ (the best in checkpoints/top_model/).
  keep_best: 3
  optimizer:
    lr: 3.0e-3
  # The job's time budget in seconds (null: none). After an epoch's saves, training stops cleanly (exit 0, logging
  # "STOP time budget after epoch <N>") when the time since train.py started plus 1.1 times the longest epoch so far
  # would exceed it, so a time-limited job ends between epochs. Run the same command again to resume.
  stop_after_seconds: null
  # Early stopping (physicsnemo.utils.EarlyStopping) on the validation loss CheckpointManager ranks, checked after every
  # validation (training.val_interval); patience and min_epochs count epochs, so a sparse cadence keeps the same numbers.
  # patience null turns it off. With patience set, training stops (exit 0, logging "STOP early stopping after epoch <N>:
  # <reason>", writing <run>/early_stop.json) when no validation improved on the best by min_delta (a fraction) for
  # patience epochs, when a validation is over divergence_factor times the best for divergence_patience validations in a
  # row, or when by min_epochs the best improves on the first validation by less than min_gain (the run never learned).
  # Neither patience nor min_gain fires before min_epochs. The counters live in checkpoints/early_stopping.json, so a
  # resumed run keeps them; a run that stopped early refuses to train further.
  early_stopping:
    patience: null
    min_delta: 0.005
    min_epochs: 0
    min_gain: null
    divergence_factor: null
    divergence_patience: 2
  # Default schedule (Carmelo, 2026-10-31): five epochs of linear warmup, then cosine annealing to min_lr at the last
  # epoch, stepped once per epoch (scheduler_update_mode: epoch). Epoch e (from 0) trains at peak * (e + 1) / 5 during
  # warmup, then at min_lr + (peak - min_lr) (1 + cos(pi t)) / 2 with t = (e + 1 - 5) / (num_epochs - 5), so the last
  # epoch trains at min_lr. Warmup is 1% of the default 500 epochs (2% of a 250-epoch run). total_steps counts
  # scheduler steps, so it equals num_epochs only under epoch stepping. A resume refuses a checkpoint whose schedule
  # differs from this one. It replaces StepLR(step_size=100, gamma=0.1).
  scheduler:
    _target_: optimization.WarmupCosine
    total_steps: ${training.num_epochs}
    warmup_steps: 5
    min_lr: 1.0e-6
