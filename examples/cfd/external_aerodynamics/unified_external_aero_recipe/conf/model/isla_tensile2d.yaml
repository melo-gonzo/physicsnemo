# ISLA, interior task, on PLAID Tensile2d (plaid_tensile2d_2d): the reference configuration of isla_volume.yaml in two
# dimensions (`dim: 2`; pair with a dataset config that runs RestrictToPlane first, as isla_volume_airfrans.yaml does). The
# boundary is the specimen's closed outer polyline (`boundaries.outer`, line cells with in-plane normals and segment lengths);
# the boundary conditions enter as per-boundary-cell fields of that mesh (boundary_schema: the loaded top edge, the fixed
# bottom edge, the pinned corner and the applied pressure), the six input scalars as named rank-0 global inputs (the
# dataset's SplitGlobalVector standardizes `params` and splits it), and the stored signed distance and its gradient as
# per-query inputs (query_schema), the same wall geometry the tensor-input baselines read. The targets are the dataset's
# native fields: four scalars and the in-plane displacement vector. No global direction: the fused kernel does not apply.
input_type: mesh
output_type: mesh

training:
  optimizer:
    lr: 3.75e-4                   # the reference configuration's rate (REF-80 verdict, 2026-10-04; see isla_surface.yaml)

# Whole-model torch.compile: one graph, compiled once for every token count; see isla_volume.yaml.
compile: true
compile_options:
  fullgraph: true
  dynamic: true
  mode: max-autotune-no-cudagraphs

forward_kwargs:
  boundary_meshes:
    outer: boundaries.outer       # Mesh[1, 2] after RestrictToPlane: line cells with in-plane normals and segment lengths
  prediction_points: interior     # the specimen's mesh nodes as a point cloud; point_data carries the query_schema fields
  global_data: global_data        # the case's TensorDict; the model selects its declared leaves

model:
  _target_: physicsnemo.experimental.models.isla.ISLA
  output_schema:                  # the dataset's targets, by name and tensor rank
    q: {rank: 0}                  # cumulated plastic strain
    displacement: {rank: 1}       # in-plane displacement (two components after RestrictToPlane)
    stress: {rank: 2, symmetric: true}   # EQ-TENSOR (2026-10-03): the in-plane stress as ONE symmetric rank-2 tensor (2 x 2 after
                                  # RestrictToPlane); the recipe reads sig11 / sig22 / sig12 off it (dataset targets: stress: {type:
                                  # symmetric_tensor, components: {sig11: xx, sig22: yy, sig12: xy}}). Replaces the three rank-0 heads,
                                  # which were invariant where the components rotate as a tensor (posed protocol, 2026-10-03).
  boundary_schema:                # per-boundary-cell inputs, all rank 0 (0/1 labels and the scaled pressure)
    bc_loaded: {rank: 0}          # 1 on the top edge (pressure P)
    bc_fixed: {rank: 0}           # 1 on the bottom edge (U2 = 0)
    bc_pinned: {rank: 0}          # 1 on the cells touching the pinned bottom-left node (U1 = 0)
    bc_pressure: {rank: 0}        # P on the loaded cells (scaled to O(1) by the dataset config), 0 elsewhere
  query_schema:
    sdf: {rank: 0}                # the stored signed distance (a length, scaled by the frame's length unit inside the model)
    sdf_normals: {rank: 1}        # the stored SDF gradient, in the plane after RestrictToPlane
  global_schema:                  # the standardized input scalars, one rank-0 field each (SplitGlobalVector)
    P_std: {rank: 0}
    p1_std: {rank: 0}
    p2_std: {rank: 0}
    p3_std: {rank: 0}
    p4_std: {rank: 0}
    p5_std: {rank: 0}
  dim: 2                          # the problem is planar
  interior: true                  # predict at prediction_points, which join the encoder as tokens
  hidden: 512                     # the reference configuration (REF-80 verdict, 2026-10-04): most accurate under 80 GiB per GPU on DrivAerML Surface and the 210-wing rung; equal to the class defaults
  n_layers: 12
  n_slices: 512
  mlp_ratio: 4
  geo_checkpoint: true
  geo_kernel: null                # auto: eager here (two dimensions and no global direction)
  compile_blocks: false           # per-block torch.compile: off, the whole model is compiled; see isla_volume.yaml
