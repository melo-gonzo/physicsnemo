# @package _global_
# FRAME-AF-Y-EAGER control (2026-09-24): the inlet + y arm (K = 2) on the eager geometry region instead of the fused kernel, to rule out a K = 2 fused-path training defect.
input_type: tensors
output_type: fields
forward_kwargs:
  points: boundaries.airfoil.cell_centroids
  normals: boundaries.airfoil.cell_data.normals            # precomputed in-plane normals (a curve in 3-D has no cell_normals)
  measure_weights: boundaries.airfoil.cell_data.quadrature_measure
  global_inputs:
    freestream: global_data.U_inf_dir
    frame_y: global_data.frame_y            # FRAME-AF-Y control: the axis normal to the inlet only (K = 2)
    speed: global_data.U_inf_mag
  query_points: interior.points
model:
  _target_: physicsnemo.experimental.models.ISLA
  outputs: {pressure: 0, nut: 0, velocity: 1}
  global_inputs: {freestream: 1, frame_y: 1, speed: 0}
  hidden: 192
  n_layers: 12
  n_slices: 256
  mlp_ratio: 4
  scale_mode: rms_distance
  query_tokens: true
  query_mass: source_total
  geo_checkpoint: true
  geo_kernel: eager
