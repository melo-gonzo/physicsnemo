# ISLA, interior task, on the GINOT PLASTIC_LUG (ginot_lug_volume): the reference configuration of isla_volume.yaml on a
# three-dimensional solid. The boundary is the lug's watertight surface triangulation (`boundaries.surface`); the boundary
# conditions enter as per-boundary-cell fields of that mesh (boundary_schema: the clamped face, the hole, the loaded half of
# the hole and the applied pressure on it), the four design parameters as named rank-0 global inputs (the dataset's
# SplitGlobalVector standardizes `params` and splits it), and the stored signed distance and its gradient as per-query inputs
# (query_schema), the same wall geometry the tensor-input baselines read. The lug has no global direction, so the fused
# geometry kernel (which needs one) does not apply and `geo_kernel: null` resolves to the eager region.
input_type: mesh
output_type: mesh

training:
  optimizer:
    lr: 3.75e-4                   # the reference configuration's rate (REF-80 verdict, 2026-10-04; see isla_surface.yaml)

forward_kwargs:
  boundary_meshes:
    surface: boundaries.surface   # Mesh[2, 3]: outward-wound triangles; centroids, normals and areas are read from it
  prediction_points: interior     # the lug's mesh nodes as a point cloud; point_data carries the query_schema fields
  global_data: global_data        # the case's TensorDict; the model selects its declared leaves

model:
  _target_: physicsnemo.experimental.models.isla.ISLA
  output_schema:
    von_mises: {rank: 0}          # MPa, standardized by the dataset config
  boundary_schema:                # per-boundary-cell inputs, all rank 0 (0/1 labels and the scaled pressure)
    bc_fixed: {rank: 0}           # 1 on the clamped end face
    bc_hole: {rank: 0}            # 1 on the hole's cylindrical surface
    bc_loaded: {rank: 0}          # 1 on the pressure-loaded half of the hole
    bc_pressure: {rank: 0}        # the applied pressure on the loaded cells (scaled to O(1) by the dataset config), 0 elsewhere
  query_schema:
    sdf: {rank: 0}                # the stored signed distance (a length, scaled by the frame's length unit inside the model)
    sdf_normals: {rank: 1}        # the stored SDF gradient
  global_schema:                  # the standardized design parameters, one rank-0 field each (SplitGlobalVector)
    hole_radius_std: {rank: 0}
    length_std: {rank: 0}
    thickness_std: {rank: 0}
    pressure_std: {rank: 0}
  interior: true                  # predict at prediction_points, which join the encoder as tokens
  hidden: 512                     # the reference configuration (REF-80 verdict, 2026-10-04): most accurate under 80 GiB per GPU on DrivAerML Surface and the 210-wing rung; the class defaults are 384 / 256
  n_layers: 12
  n_slices: 512
  mlp_ratio: 4
  geo_checkpoint: true
  geo_kernel: null                # auto: eager here (no global direction, which the fused kernel requires)
  compile_blocks: true            # per-block torch.compile (PERF-3, 2026-10-01); see isla_volume.yaml
