# ISLA, interior task, on the GINOT PLASTIC_LUG (ginot_lug_volume): the reference configuration of isla_volume.yaml on a
# three-dimensional solid. The boundary is the lug's watertight surface triangulation (`boundaries.surface`), which the
# dataset labels by condition (bc_fixed, bc_hole, bc_loaded); SplitBoundaryByLabels (dataset_append_transforms below, for this
# model only) splits it into four named boundary conditions (boundary_schemas): the clamped face, the loaded half of the hole
# with its applied pressure, the rest of the hole and the free surface, together the same cells. The four design parameters
# enter as named rank-0 global inputs (the dataset's SplitGlobalVector standardizes `params` and splits it). No query_schema:
# each node's distance and direction to the surface are computed inside the model, exactly, from the boundary meshes, so the
# dataset's stored sdf and sdf_normals (the baselines' inputs) are not read. The lug has no global direction, so the fused
# geometry kernel (which needs one) does not apply and the model runs the eager region.
input_type: mesh
output_type: mesh

# ISLA-only steps after the dataset's own chain (the baselines read the dataset as it is): one boundary per condition, the
# first label winning where two mark a cell (the loaded cells are part of the hole), the unlabelled cells the free surface.
dataset_append_transforms:
  - _target_: ${dp:SplitBoundaryByLabels}
    boundary: surface
    labels: {loaded: bc_loaded, hole: bc_hole, fixed: bc_fixed}
    rest: free

training:
  optimizer:
    lr: 3.75e-4                   # the reference configuration's rate (REF-80 verdict, 2026-10-04; see isla_surface.yaml)

# Whole-model torch.compile: one graph, compiled once for every token count; see isla_volume.yaml.
compile: true
compile_options:
  fullgraph: true
  dynamic: true
  mode: max-autotune-no-cudagraphs

forward_kwargs:
  boundary_meshes:                # Mesh[2, 3] each: outward-wound triangles of the lug's surface, split by condition
    fixed: boundaries.fixed
    hole: boundaries.hole
    loaded: boundaries.loaded
    free: boundaries.free
  prediction_points: interior     # the lug's mesh nodes as a point cloud
  global_data: global_data        # the case's TensorDict; the model selects its declared leaves

model:
  _target_: physicsnemo.experimental.models.isla.ISLA
  output_schema:
    von_mises: {rank: 0}          # MPa, standardized by the dataset config
  boundary_schemas:               # the boundary conditions by name, each with its own per-cell fields
    fixed: {}                     # the clamped end face
    hole: {}                      # the unloaded half of the hole's cylindrical surface
    loaded:                       # the pressure-loaded half of the hole
      bc_pressure: {rank: 0}      # the applied pressure (scaled to O(1) by the dataset config)
    free: {}                      # the traction-free rest of the surface
  global_schema:                  # the standardized design parameters, one rank-0 field each (SplitGlobalVector)
    hole_radius_std: {rank: 0}
    length_std: {rank: 0}
    thickness_std: {rank: 0}
    pressure_std: {rank: 0}
  interior: true                  # predict at prediction_points, which join the encoder as tokens
  boundary_tokens: 200000         # boundary tokens drawn per case inside the model (equal to the class default; the lug surface is kept whole)
  hidden: 512                     # the reference configuration (REF-80 verdict, 2026-10-04): most accurate under 80 GiB per GPU on DrivAerML Surface and the 210-wing rung; equal to the class defaults
  n_layers: 12
  n_slices: 512
  compile_blocks: false           # per-block torch.compile: off, the whole model is compiled; see isla_volume.yaml
