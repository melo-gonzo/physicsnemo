# isla_volume_aerozoo.yaml with the flow axis (2026-10-31): flow_axis, the unit vector from the inlet faces'
# centroid weighted by their volume flow rate to the outlet faces' centroid weighted by area (ComputeFlowAxis), as a
# second global direction beside the inlet's g (K = 2). Computed after the dataset's chain on the meshes ISLA
# receives (full resolution, normals into the fluid; the axis does not depend on their orientation). The parent's two
# appended steps are restated (a Hydra list is replaced, not extended); everything else is the parent's.
defaults:
  - isla_volume_aerozoo
  - _self_

dataset_append_transforms:
  - _target_: ${dp:ComputeBoundaryScales}
    boundaries: [inlet, outlet, no_slip, slip]    # forward_kwargs.boundary_meshes
    length_field: L
    speed_field: U
    sources: [[inlet, bc_velocity]]
  - _target_: ${dp:ComputeLogReynolds}
    speed_field: U
    length_field: L
    viscosity_field: physics.kinematic_viscosity
    mean: null
    std: null
    output_field: log_re
    standardized_field: re_z
  - _target_: ${dp:ComputeFlowAxis}
    inlets: [inlet]
    outlets: [outlet]
    velocity_field: bc_velocity
    output_field: flow_axis
model:
  global_schema:
    flow_axis: {rank: 1}         # a global direction (K = 2 with the inlet's g)
