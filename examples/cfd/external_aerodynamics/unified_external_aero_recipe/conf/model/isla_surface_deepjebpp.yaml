# ISLA, surface task, on DeepJEB++ (deepjebpp_surface): the reference configuration of isla_surface.yaml on a linear-elastic
# bracket. The outputs are predicted at the bracket's surface cells (`boundaries.surface`, the FEM surface triangulation);
# the load case enters through the boundary mesh's per-cell fields (boundary_schema: the clamped cells, the loaded cells and
# the applied traction vector on them) and through the global inputs: the load direction (force direction or moment axis)
# as the one rank-1 global input, and the load type as two rank-0 global fields (the dataset's SplitGlobalVector splits the
# stored one-hot `load_type` into `is_force` / `is_torque`). One global direction plus one rank-1 boundary input: the fused
# geometry kernel applies.
input_type: mesh
output_type: mesh

training:
  optimizer:
    lr: 3.75e-4                   # the reference configuration's rate (REF-80 verdict, 2026-10-04; see isla_surface.yaml); with the
                                  # normalized slice reads (H-RESID A2) ISLA trains at it on DeepJEB++ without the mean-field plateau

# Whole-model torch.compile: one graph, compiled once for every token count; see isla_volume.yaml.
compile: true
compile_options:
  fullgraph: true
  dynamic: true
  mode: max-autotune-no-cudagraphs

forward_kwargs:
  boundary_meshes:
    surface: boundaries.surface   # Mesh[2, 3]; centroids, normals and the subsample's corrected measure are read from it
  global_data: global_data        # the case's TensorDict; the model selects its declared leaves

model:
  _target_: physicsnemo.experimental.models.isla.ISLA
  output_schema:                  # the dataset's targets, by name and tensor rank
    von_mises: {rank: 0}
    displacement: {rank: 1}
  boundary_schema:                # per-boundary-cell inputs
    bc_fixed: {rank: 0}           # 1 on cells touching a clamped bolt node
    bc_loaded: {rank: 0}          # 1 on cells touching a loaded lug node
    bc_load: {rank: 1}            # the applied traction on the loaded cells (standardized by the dataset config), 0 elsewhere
  global_schema:
    load_dir: {rank: 1}           # the load direction (force) or moment axis (torsion); normalized to a unit direction inside the model
    is_force: {rank: 0}           # the load-type one-hot, one rank-0 field per component (SplitGlobalVector)
    is_torque: {rank: 0}
  hidden: 512                     # the reference configuration (REF-80 verdict, 2026-10-04): most accurate under 80 GiB per GPU on DrivAerML Surface and the 210-wing rung; equal to the class defaults
  n_layers: 12
  n_slices: 512
  compile_blocks: false           # per-block torch.compile: off, the whole model is compiled; see isla_volume.yaml
