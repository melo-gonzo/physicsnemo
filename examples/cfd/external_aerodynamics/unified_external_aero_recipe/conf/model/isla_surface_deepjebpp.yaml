# ISLA, surface task, on DeepJEB++ (deepjebpp_surface): the reference configuration of isla_surface.yaml on a linear-elastic
# bracket. The outputs are predicted at the bracket's surface cells (`boundaries.surface`, the FEM surface triangulation),
# which the dataset labels by condition (bc_fixed, bc_loaded); SplitBoundaryByLabels (dataset_append_transforms below, for
# this model only) splits it into three named boundary conditions (boundary_schemas): the loaded cells with the applied
# traction vector, the clamped cells and the free surface, and puts the scored cell centroids (the interior point cloud) in
# the order of ISLA's predictions (the conditions in sorted name order). The load case also enters through the global
# inputs: the load direction (force direction or moment axis) as the one rank-1 global input, and the load type as two rank-0 global fields (the dataset's SplitGlobalVector splits the
# stored one-hot `load_type` into `is_force` / `is_torque`). One global direction plus one rank-1 boundary input: the fused
# geometry kernel applies.
input_type: mesh
output_type: mesh

# ISLA-only steps after the dataset's own chain (the baselines read the dataset as it is): one boundary per condition, the
# loaded label winning where both mark a cell, the unlabelled cells the free surface; the interior (the scored cell
# centroids and their targets) permuted to the order of the predictions, the same points.
dataset_append_transforms:
  - _target_: ${dp:SplitBoundaryByLabels}
    boundary: surface
    labels: {loaded: bc_loaded, fixed: bc_fixed}
    rest: free
    reorder_interior: true

training:
  optimizer:
    lr: 3.75e-4                   # the reference configuration's rate (REF-80 verdict, 2026-10-04; see isla_surface.yaml); with the
                                  # normalized slice reads (H-RESID A2) ISLA trains at it on DeepJEB++ without the mean-field plateau

# Whole-model torch.compile: one graph, compiled once for every token count; see isla_volume.yaml.
compile: true
compile_options:
  fullgraph: true
  dynamic: true
  options:                       # mode max-autotune-no-cudagraphs's options, with mix-order reduction off
    max_autotune: true           # (torch 2.12-2.13 miscompile it; see isla_volume_airfrans.yaml)
    coordinate_descent_tuning: true
    triton.mix_order_reduction: false

forward_kwargs:
  boundary_meshes:                # Mesh[2, 3] each; centroids, normals and the subsample's corrected measure are read from them
    fixed: boundaries.fixed
    free: boundaries.free
    loaded: boundaries.loaded
  prediction_boundaries: {literal: [fixed, free, loaded]}   # the outputs are predicted at every surface cell, all three conditions
  global_data: global_data        # the case's TensorDict; the model selects its declared leaves

model:
  _target_: physicsnemo.experimental.models.isla.ISLA
  output_schema:                  # the dataset's targets, by name and tensor rank
    von_mises: {rank: 0}
    displacement: {rank: 1}
  boundary_schemas:               # the boundary conditions by name, each with its own per-cell fields
    fixed: {}                     # the cells touching a clamped bolt node
    loaded:                       # the cells touching a loaded lug node
      bc_load: {rank: 1}          # the applied traction (standardized by the dataset config)
    free: {}                      # the traction-free rest of the surface
  global_schema:
    load_dir: {rank: 1}           # the load direction (force) or moment axis (torsion); normalized to a unit direction inside the model
    is_force: {rank: 0}           # the load-type one-hot, one rank-0 field per component (SplitGlobalVector)
    is_torque: {rank: 0}
  hidden: 512                     # the reference configuration (REF-80 verdict, 2026-10-04): most accurate under 80 GiB per GPU on DrivAerML Surface and the 210-wing rung; equal to the class defaults
  n_layers: 12
  n_slices: 512
  compile_blocks: false           # per-block torch.compile: off, the whole model is compiled; see isla_volume.yaml
