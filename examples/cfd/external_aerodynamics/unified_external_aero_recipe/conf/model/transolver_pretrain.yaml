# ---------------------------------------------------------------------------
# Transolver template -- GeoPT PRETRAINING.
# ---------------------------------------------------------------------------
# `TransolverPretrainBackbone` wraps the stock Transolver: the backbone's
# last-block output projection is replaced with a TrajectoryHead MLP that
# emits `(B, N, n_steps * 3)` per-point trajectory features matching the
# `walks_supervise` target produced by the WalkSampler dataset transform
# (per-walk schema; see `pr2-recipe-extension-plan.md` Q5 resolution).
#
# Pairs canonically with `dataset=geopt_pretrain`. Canonical invocation:
#
#     python src/train.py \
#         model=transolver_pretrain \
#         dataset=geopt_pretrain \
#         training.num_epochs=200
#
# A subsequent fine-tune onto DrivAerML reuses the resulting checkpoint
# via PR 2.5's `cfg.training.pretrained_backbone:` hook with
# `key_remap={"transolver.": ""}` (strip the wrapper prefix) and
# `exclude_layers=["trajectory_head"]` (drop the head). See
# `pr2-recipe-extension-plan.md` for the full workflow.
input_type: tensors
output_type: tensors

# `forward_kwargs` resolver concatenates a list along the last dim and
# returns a single tensor. So `embedding` becomes
# `(B, N, 7) = points (3) + sdf (1) + normals_face_barycentric (3)`,
# and `fx` becomes `(B, N, 4) = directions (3) + step_lengths (1)`.
# The latter two keys are populated by the `WalkSampler` transform on
# the dataset side (per-walk slice of `interior.global_data.walks_*`).
forward_kwargs:
  embedding:
    - interior.points
    - interior.point_data.sdf
    - interior.point_data.normals_face_barycentric
  fx:
    - interior.point_data.directions
    - interior.point_data.step_lengths

model:
  _target_: physicsnemo.experimental.pnm_pretraining.models.TransolverPretrainBackbone
  # `out_dim` is computed by the wrapper from `n_steps` (n_steps * 3),
  # so we deliberately do NOT pass `${out_dim}`. The recipe's
  # `build_dataloaders` still injects `cfg.out_dim` at the top level
  # by summing channels declared in the dataset YAML's `targets:`
  # block. Per the PR 2 follow-up, that block lists `n_steps` separate
  # `vector` fields (`supervise_step0`, `supervise_step1`, ...), so
  # `cfg.out_dim` resolves to `n_steps * 3` — the same value the
  # wrapper computes internally. The wrapper validates the two agree
  # if a caller passes `out_dim` explicitly; we omit it here so the
  # template stays minimal. Users overriding `n_steps` on the CLI must
  # also adjust the dataset's targets block to list the matching
  # number of `supervise_step{i}` fields (see `datasets/geopt_pretrain.yaml`).
  functional_dim: 4         # fx = directions (3) + step length (1)
  embedding_dim: 7          # embedding = points (3) + sdf (1) + normals (3)
  n_steps: 3                # GeoPT's released default; matches builder.py
  head_hidden_dim: 256
  head_n_layers: 2
  head_activation: "gelu"
  # Backbone hyperparameters mirror conf/model/transolver_volume.yaml
  # so a checkpoint produced here loads cleanly into the volume model
  # with key_remap+exclude.
  n_layers: 12
  n_hidden: 256
  dropout: 0.0
  n_head: 8
  act: "gelu"
  mlp_ratio: 4
  slice_num: 256
  unified_pos: false
  structured_shape: null    # unstructured mesh
  use_te: false
  plus: false
