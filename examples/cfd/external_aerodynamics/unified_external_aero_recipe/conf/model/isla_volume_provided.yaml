# ISLA interior configuration with the interior geometry PROVIDED by the dataset
# (interior_geometry=provided): the query direction is the stored SDF gradient
# and the signed distance a declared rank-0 query input, both computed on the
# full mesh by the dataset's ComputeSDFFromBoundary stage. Everything else is
# isla_volume.yaml, whose model derives both quantities from the sampled
# boundary. This variant exists for the INTERNAL-GEOMETRY measurement (book
# notebook #sec-nb-internal-geometry-prereg) and to reproduce interior lanes
# trained before 2026-09-23.
defaults:
  - isla_volume

forward_kwargs:
  query_normals: interior.point_data.sdf_normals
  query_inputs:
    sdf: interior.point_data.sdf        # the signed distance to the wall at each query (full mesh)

model:
  interior_geometry: provided
  query_inputs:
    sdf: 0                       # rank-0 per-query input, scaled by the frame's length unit (query_scalar_scale)
