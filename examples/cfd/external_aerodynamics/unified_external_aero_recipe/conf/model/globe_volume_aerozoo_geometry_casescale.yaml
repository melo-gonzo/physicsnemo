# ---------------------------------------------------------------------------
# GLOBE, stock volume template, on AeroZoo v1.2's interior task from geometry only
# (benchmark aerozoo-interior-full, as a model that reads no
# boundary condition; datasets/aerozoo_uvolume*.yaml).
# ---------------------------------------------------------------------------
# globe_volume.yaml as it is, with three changes. Its one boundary is AeroZoo's no_slip walls (the body and, in a
# duct, the duct walls) in place of DrivAerML's vehicle, with no cell_data leaf declared, so GLOBE reads the wall
# geometry and none of the prescribed values. Its output schema lists the interior task's seven mean fields in
# place of DrivAerML's three. Its global schema declares nu_std, the standardized log10 viscosity every other
# baseline reads, so GLOBE gets the same inputs as the other models without boundary conditions (2026-10-29). It
# reads no inflow, so it is reported as a floor without the boundary conditions.
# Derived-inputs arm (2026-10-29): this file is globe_volume_aerozoo_geometry.yaml on
# datasets/aerozoo_uvolume_casescale.yaml (ISLA's per-case scales applied in the datapipe), with re_z, the standardized
# log10(U L / nu) that file computes, in place of nu_std, which it does not make. A copy rather than a Hydra child
# because a defaults merge cannot remove the parent's nu_std from global_schema. The reference lengths stay the stock
# constants, now in units of L.
# The reference lengths and area stay the stock constants (one value for every case, so no per-case scale). The
# loss is the AeroZoo protocol's (per-case relative L2, velocity weight 3).
dataset: aerozoo_uvolume_casescale   # the dataset this arm trains on; a command-line dataset= still wins
input_type: mesh
output_type: mesh
dataset_reader_overrides:
  drop_in_file_boundaries: false
training:
  loss_type: case_relative_l2
  field_weights:
    velocity: 3

forward_kwargs:
  prediction_points: interior.points          # interior cell centroids
  boundary_meshes:
    no_slip: boundaries.no_slip               # the no-slip walls, geometry only
  global_data: global_data                    # the case's TensorDict; GLOBE keeps its declared leaf, re_z
  reference_lengths:
    L_ref: 1.0
    delta_turb: 0.015
model:
  _target_: physicsnemo.experimental.models.globe.GLOBE
  n_spatial_dims: 3
  output_schema:                # the seven mean fields (datasets/aerozoo_uvolume.yaml targets)
    velocity: {rank: 1}
    pressure: {rank: 0}
    nut: {rank: 0}
    tke: {rank: 0}
    omega: {rank: 0}
    intermittency: {rank: 0}
    retheta: {rank: 0}
  boundary_source_schemas:
    no_slip: {}
  reference_length_names: [L_ref, delta_turb]
  reference_area: 0.0868       # 2.170 / 5.0^2 (nondim)
  global_schema:
    re_z: {rank: 0}             # standardized log10(U L / nu), as the other derived-inputs baselines read it
  n_communication_hyperlayers: 2
  hidden_layer_sizes: [256, 256, 256]
  n_latent_scalars: 8
  n_latent_vectors: 4
  n_spherical_harmonics: 1
  theta: 10.0
  leaf_size: 1
  network_type: "pade"
  self_regularization_beta: 0.01
  latent_compression_scale: 100.0
  expand_far_targets: true
