# ---------------------------------------------------------------------------
# GeoTransolver template -- VOLUME recipe for AeroZoo v1.2, physical inputs.
# ---------------------------------------------------------------------------
# On datasets/aerozoo_uvolume*.yaml (the PDE data only, in SI units, no
# per-case scale; 2026-10-19) GeoTransolver sees the
# boundary conditions through its documented geometry-features channel:
# `geometry` is every boundary face of the case's four boundaries
# (boundaries.merged, MergeBoundaries), each one token carrying its centroid
# (m, raw), its condition type (one-hot inlet / outlet / no_slip / slip) and
# its prescribed values (velocity, pressure, k, omega, intermittency,
# Re_theta_t and the outlet's reverse-flow values, standardized by
# per-dataset constants). The tokenizer takes any geometry_dim; the ball
# query does not (it accepts xyz only), so the ball-query local features are
# off. That departs from the released GeoTransolver configurations, which all
# set include_local_features: true (transformer_models, crash, drop_test);
# false is the constructor default and is unit-tested
# (test/models/geotransolver), so it is supported. The local embedding is the
# query point (m, raw) with its signed distance and normal to the no_slip body
# (m); the global embedding is log10 nu standardized by per-dataset constants
# (nu_std), the only global PDE parameter. Width, depth, slices and the rate
# are the reference configuration's (geotransolver_volume.yaml; the CHAR rate
# 1e-3). The released model code is unchanged: this is a choice of inputs.
#
# The loss is the per-case relative L2 every AeroZoo model sets
# (loss.py `case_relative_l2`): each case's error per field over its own
# physical targets' norm, so the cases weigh alike although their physical
# magnitudes span decades. Velocity weighs 3: case_relative_l2 gives each
# field one term (the vector's components jointly), so the weight keeps the
# channel balance of the per-component losses, velocity's 3 components
# against the 6 scalars (ISLA's AeroZoo config is to use the same weights).
# The targets are the interior task's seven fields (out_dim 9 from the
# dataset's `targets:`): velocity, pressure, nut, k, omega and the two
# dimensionless transition fields, intermittency and Re_theta_t (retheta).
# The targets are standardized by scale only, so the recipe's relative-L2
# metric is the physical relative L2 of each field and case.
dataset_reader_overrides:
  # The boundaries stay: the SDF and the merged face tokens are made from them.
  drop_in_file_boundaries: false

input_type: tensors
output_type: tensors

# The CHAR campaign's GeoTransolver rate on DrivAerML Volume, 1e-3
# (results/campaigns_2026-10-02/char/kernel/cl/cl_lanes.tsv, lanes cl_vol_gt_seed42/43).
training:
  optimizer:
    lr: 1.0e-3
  loss_type: case_relative_l2
  field_weights:
    velocity: 3

forward_kwargs:
  geometry:
    - boundaries.merged.cell_centroids
    - boundaries.merged.cell_data.bc_inlet
    - boundaries.merged.cell_data.bc_outlet
    - boundaries.merged.cell_data.bc_no_slip
    - boundaries.merged.cell_data.bc_slip
    - boundaries.merged.cell_data.bc_velocity
    - boundaries.merged.cell_data.bc_velocity_reverse
    - boundaries.merged.cell_data.bc_pressure
    - boundaries.merged.cell_data.bc_tke
    - boundaries.merged.cell_data.bc_omega
    - boundaries.merged.cell_data.bc_intermittency
    - boundaries.merged.cell_data.bc_retheta
    - boundaries.merged.cell_data.bc_tke_reverse
    - boundaries.merged.cell_data.bc_omega_reverse
    - boundaries.merged.cell_data.bc_intermittency_reverse
    - boundaries.merged.cell_data.bc_retheta_reverse
  local_embedding:
    - interior.points
    - interior.point_data.sdf_wall
    - interior.point_data.sdf_wall_normals
  global_embedding: global_data.nu_std

model:
  _target_: physicsnemo.models.geotransolver.GeoTransolver
  out_dim: ${out_dim}     # auto-set from the chosen dataset's `targets:` block
  functional_dim: 7       # local_embedding = coords (3) + sdf_wall (1) + sdf_wall_normals (3)
  geometry_dim: 22        # centroid (3) + one-hot (4) + two velocities (6) + nine scalar values
  global_dim: 1           # nu_std
  n_layers: 12
  n_hidden: 256
  dropout: 0.0
  n_head: 8
  act: "gelu"
  mlp_ratio: 4
  slice_num: 256
  use_te: false
  plus: false
  include_local_features: false
  state_mixing_mode: "weighted"  # "weighted" (default) or "concat_project"
  activation_checkpointing: false
  checkpointing_ratio: 1.0
  activation_checkpointing_components: [blocks]
