# smart_volume_aerozoo_geometry_casescale.yaml with the flow axis (datasets/aerozoo_uvolume_flowaxis.yaml, 2026-10-31): re_z and flow_axis, the unit vector
# from the inflow to the outflow (ComputeFlowAxis), as its global input; everything else is the parent's.
defaults:
  - smart_volume_aerozoo_geometry_casescale
  - _self_

dataset: aerozoo_uvolume_flowaxis    # the dataset this arm trains on; a command-line dataset= still wins

forward_kwargs:
  parameters: [global_data.re_z, global_data.flow_axis]
model:
  parameter_channels: 4     # re_z (1) + flow_axis (3)
