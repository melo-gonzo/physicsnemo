# @package _global_
# ISLA surface task with the body frame as global directions (pairs with datasets/drivaer_ml_surface_frame.yaml).
# The reference configuration's hyperparameters are unchanged; only the global inputs differ (FRAME-3D, 2026-09-26).

# ---------------------------------------------------------------------------
# ISLA (Invariant Slice Attention) -- SURFACE recipe (reference configuration).
# ---------------------------------------------------------------------------
# The ISLA reference configuration: ISLA's one frame has no origin (positions
# enter only through point-to-anchor differences; no centroid and no per-sample
# frame anywhere in the forward pass; the centered-frame options were removed
# on 2026-09-20), and the length unit is the measure-weighted root-mean-square
# pairwise distance of the sampled surface (scale_mode=rms_distance: normalized,
# center-free, finite on any boundary with a finite second moment; validated
# against the total-measure unit on 2026-09-18, LEN-RMS, within 1.3%), so no
# per-dataset reference length is needed. scale_mode=total_measure (the square
# root of the total quadrature measure) remains an option and is the unit of
# runs trained before then. Translation invariance is exact without centering;
# the frame carries no information about where the mesher put its cells. The
# setting is also the class default and is stated here explicitly.
#
# Consumes the same DomainMesh paths as the GeoTransolver template plus the
# recorded target quadrature measure (measure_weights). The freestream
# direction is external aerodynamics' one global vector input (K = 1); other
# PDEs pass their own global vectors and global scalars (see the ISLA class
# docstring).
#
# The centered-frame variant (isla_surface_constant_gauge.yaml) was removed on
# 2026-09-20 together with the class options that selected it.
# Naming note: until 2026-09-15 this file carried the constant gauge and the
# reference configuration lived in isla_surface_reference.yaml, which is now a
# pointer to this file.
input_type: tensors
output_type: fields

# Learning rate: 5e-4, the reference configuration's rate (REF verdict,
# 2026-09-23, book notebook: ref-verdict), which is also the width rule
# lr = 1e-3 x 192 / hidden at hidden 384 (the 192-wide protocol of 2026-09-17
# trained at 1e-3). Pinned here because the recipe's default of 3e-3
# (GeoTransolver's) drives ISLA within five epochs to a mean-field plateau
# (validation loss 0.06 against 0.0008 at 1e-3, 192 wide; notebook:
# lrref-verdict) and 1e-2 diverges. For other widths start from the width rule
# (3.75e-4 at 512; notebook: relframe-divergence, corner-wlr, cg-wlr verdicts).
# A CLI override still wins.
training:
  optimizer:
    lr: 5.0e-4

forward_kwargs:
  points: interior.points
  normals: boundaries.vehicle.cell_data.normals
  measure_weights: interior.point_data._effective_measure
  global_inputs:
    freestream: global_data.U_inf_dir   # the one global direction of external aerodynamics; other PDEs pass their own fields
    frame_x: global_data.frame_x        # the body frame as three more global directions (drivaer_ml_surface_frame.yaml); K = 4 fits the fused kernel
    frame_y: global_data.frame_y
    frame_z: global_data.frame_z

model:
  _target_: physicsnemo.experimental.models.ISLA
  outputs:                       # the dataset's targets, by name and tensor rank (0 scalar, 1 vector)
    pressure: 0
    wss: 1
  global_inputs:
    freestream: 1                # a rank-1 global input: normalized to a unit direction inside the model
    frame_x: 1
    frame_y: 1
    frame_z: 1
  hidden: 384                  # the reference configuration (REF verdict, 2026-09-23); also the class defaults
  n_layers: 12
  n_slices: 256
  mlp_ratio: 4
  scale_mode: rms_distance
  # Rebuild the per-slice geometric invariants inside backward instead of
  # storing them: forward and gradients bitwise identical, lower peak training
  # memory for a modest step-time cost. Set false to trade memory for speed.
  geo_checkpoint: true
  # Geometry kernel: null = automatic (2026-09-19 ruling): the exact fused Triton kernel
  # wherever it can run (CUDA, one global direction, <= 1024 slices, no rank-1/2 per-token
  # inputs; about a third of the eager step time and memory at 200,000 cells), the eager
  # PyTorch region otherwise. Force with `eager` or `fused`.
  geo_kernel: null
