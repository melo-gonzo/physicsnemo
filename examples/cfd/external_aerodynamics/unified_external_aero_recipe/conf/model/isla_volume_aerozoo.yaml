# ISLA, interior task, on AeroZoo v1.2 (datasets/aerozoo_volume.yaml): the reference configuration of
# isla_volume.yaml with the case's four boundaries (inlet, outlet, no_slip, slip) as boundary meshes. The
# boundary conditions enter as per-face fields that the dataset harmonizes across the four meshes (one
# declaration applies to every mesh): a one-hot role label and the prescribed values, zero where a role
# prescribes nothing. The global inputs are the unit freestream direction, the standardized log Reynolds
# number and the inlet's four standardized turbulence quantities. No query_schema: each prediction point's
# geometry (signed distance to the nearest boundary token and the direction to it) is computed inside the
# model from the boundary sample, so the dataset's stored sdf_wall / sdf_slip (GeoTransolver's inputs) are
# not read.
#
# The boundary measure must sum to the surface area: a subsampled boundary's raw cell areas sum to the kept
# fraction of it, so the model reads the Horvitz-Thompson corrected `cell_data._effective_measure` that the
# reader's cell subsample writes (`boundary_subsample: cells`, 50,000 faces per role).
input_type: mesh
output_type: mesh

# Learning rate pinned at the reference configuration's rate, 3.75e-4 (REF-80
# verdict, 2026-10-04; the width rule 1e-3 x 192 / hidden at 512): the recipe
# default of 3e-3 drives the model to a mean-field plateau (book notebook:
# lrref-verdict; see isla_surface.yaml).
training:
  optimizer:
    lr: 3.75e-4

forward_kwargs:
  boundary_meshes:                    # Mesh[2, 3] each, with the corrected cell measure in cell_data
    inlet: boundaries.inlet
    outlet: boundaries.outlet
    no_slip: boundaries.no_slip
    slip: boundaries.slip             # may have 0 faces on a case without slip walls
  prediction_points: interior         # the interior point-cloud Mesh
  global_data: global_data            # the case's TensorDict; the model selects its declared leaves

model:
  _target_: physicsnemo.experimental.models.isla.ISLA
  output_schema:                 # the dataset's targets, by name and tensor rank
    velocity: {rank: 1}
    pressure: {rank: 0}
    nut: {rank: 0}
    tke: {rank: 0}
    omega: {rank: 0}
  boundary_schema:               # per-boundary-cell inputs, read from every boundary mesh's cell_data
    bc_inlet: {rank: 0}          # one-hot role labels (HarmonizeBoundaryFields)
    bc_outlet: {rank: 0}
    bc_no_slip: {rank: 0}
    bc_slip: {rank: 0}
    bc_velocity: {rank: 1}       # prescribed Dirichlet values (nondimensional), 0 where the role prescribes none
    bc_pressure: {rank: 0}
    bc_tke: {rank: 0}
    bc_omega: {rank: 0}
    bc_intermittency: {rank: 0}
    bc_retheta: {rank: 0}
    bc_velocity_reverse: {rank: 1}   # the outlet's reverse-flow values
    bc_tke_reverse: {rank: 0}
    bc_omega_reverse: {rank: 0}
    bc_intermittency_reverse: {rank: 0}
    bc_retheta_reverse: {rank: 0}
  global_schema:
    U_inf_dir: {rank: 1}         # the unit freestream direction, read from global_data.U_inf_dir
    log_re_std: {rank: 0}        # (log10 Re - 5.5) / 1.5
    inlet_tke_std: {rank: 0}     # the inlet's turbulence quantities, standardized over the train split
    inlet_omega_std: {rank: 0}
    inlet_intermittency_std: {rank: 0}
    inlet_retheta_std: {rank: 0}
  interior: true                 # predict at prediction_points, which join the encoder as tokens
  hidden: 512                  # the reference configuration (REF-80 verdict, 2026-10-04): most accurate under 80 GiB per GPU on DrivAerML Surface and the 210-wing rung; equal to the class defaults
  n_layers: 12
  n_slices: 512
  mlp_ratio: 4
  geo_checkpoint: true
  # Geometry kernel: null = automatic: the exact fused Triton kernel wherever
  # it can run (CUDA, one to four per-point vectors, <= 1024 slices, no rank-2
  # per-token inputs), the eager PyTorch region otherwise. Force with `eager`
  # or `fused`.
  geo_kernel: null
  # Run every slice block under torch.compile (built at the first step; parameter
  # names and checkpoints unchanged; the fused kernel stays a custom-op leaf). At
  # 200,000 cells on four GB300 ranks: step 221 -> 180 ms and peak memory
  # 44.9 -> 32.9 GiB on DrivAerML Surface, 475 -> 308 ms and 88.5 -> 64.5 GiB on
  # the Volume, at bfloat16 roundoff (PERF-3, 2026-10-01). The recipe's own
  # `compile` flag compiles the whole model and recompiles every case (the mesh
  # vertex count varies); leave it false and use this instead.
  compile_blocks: true
