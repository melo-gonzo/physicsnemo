# ISLA, interior task, on AeroZoo v1.2 (datasets/aerozoo_uvolume.yaml, the PDE data only, in SI units): the
# reference configuration of isla_volume.yaml with the case's four boundaries (inlet, outlet, no_slip, slip) as
# four named boundary conditions (boundary_schemas). Each condition declares only the values it prescribes, read
# from its own mesh's cell_data (the dataset's prescribed.* fields under their recipe names, in SI units): the
# inlet its velocity and turbulence values, the outlet its pressure and reverse-flow values, the no-slip and slip
# walls none. The condition's identity is in the model's parameters (its own input layer), so no role label is
# read, and the dataset's HarmonizeBoundaryFields (one-hot role labels and zero-filled copies of the other roles'
# fields) is dropped for this model. No query_schema: each prediction point's geometry (its signed distance to
# the boundary surface, the union of the four meshes, and the direction from it) is computed inside the model
# from the exact closest point on their cells, positive in the fluid (the dataset files reorient the four
# boundaries, stored with their normals out of the fluid), so the dataset's stored SDF (the baselines' input)
# is not read.
#
# ISLA brings its own scales (DESIGN_v2 section 4; the model's docstring, *Scales*): the length L is the RMS
# pairwise distance of the four boundaries' faces at full resolution, the velocity U the area-weighted RMS
# speed of the inlet's prescribed velocity (its velocity_scale source) and g its area-weighted mean direction
# (the one global direction, K = 1) and rho the density (physics.density, the PDE's parameter, consumed by its
# role). Each declared input is divided by its units' scale before it enters the model, the standardized
# log10(U L / nu) with the same U and L and nu the kinematic viscosity (the recipe's ComputeBoundaryScales and
# ComputeLogReynolds below) is one global scalar, re_z, and each output is the head's dimensionless
# prediction times its units' scale, then standardized by the dataset's own NormalizeMeshFields stats
# (output_stats, which train.py injects and checks), so the loss compares it with the same physical targets as
# every other arm. No label and no per-case scale of the recipe is read.
#
# The four boundaries go in at full resolution and ISLA draws its boundary tokens inside the model:
# `n_boundary_tokens` (200,000, the class default) per case, water-filled over the four roles (50,000 each when
# all four have more faces; a role with fewer is kept whole and its unused share goes to the others), each
# face drawn with probability proportional to its area and carrying its Horvitz-Thompson measure. So the
# datapipe's boundary subsampling is switched off for this model only (the baselines keep it): the files'
# reader reads every boundary whole, and `dataset_drop_transforms` removes their SubsampleMesh and the steps
# only the baselines read.
dataset_drop_transforms:
  - SubsampleMesh                     # the per-boundary 50,000-face cap
  - ComputeSDFFromBoundary            # sdf_wall / sdf_wall_normals: the baselines' inputs, not ISLA's
  - HarmonizeBoundaryFields           # the one-hot role labels and zero-filled fields: ISLA reads each condition's own
  - MergeBoundaries                   # GeoTransolver's face tokens, made from the harmonized fields
# ISLA's Reynolds number, computed here rather than in the model (2026-10-24): after the dataset's chain, on the
# meshes the model receives, L (the four boundaries' RMS pairwise distance) and U (the inlet's area-weighted RMS
# speed) exactly as ISLA computes its scales, then re_z = (log10(U L / nu) - mean) / std in float64. mean and std
# are null here: src/datasets.py fills them from the dataset file's isla_constants.reynolds, fitted on the split's
# train cases. Only the posed problem is read (the meshes, the inlet's velocity, physics.kinematic_viscosity).
dataset_append_transforms:
  - _target_: ${dp:ComputeBoundaryScales}
    boundaries: [inlet, outlet, no_slip, slip]    # forward_kwargs.boundary_meshes
    length_field: L
    speed_field: U
    sources: [[inlet, bc_velocity]]
  - _target_: ${dp:ComputeLogReynolds}
    speed_field: U
    length_field: L
    viscosity_field: physics.kinematic_viscosity
    mean: null
    std: null
    output_field: log_re
    standardized_field: re_z
input_type: mesh
output_type: mesh

# Learning rate pinned at the reference configuration's rate, 3.75e-4 (REF-80
# verdict, 2026-10-04; the width rule 1e-3 x 192 / hidden at 512): the recipe
# default of 3e-3 drives the model to a mean-field plateau (book notebook:
# lrref-verdict; see isla_surface.yaml).
#
# The loss is the per-case relative L2 with velocity weighed 3, as in geotransolver_volume_aerozoo.yaml (every
# AeroZoo model sets the same): each case's error per field over its own physical targets' norm.
training:
  optimizer:
    lr: 3.75e-4
  loss_type: case_relative_l2
  field_weights:
    velocity: 3

# Per-block compile (compile_blocks below), as in isla_volume.yaml: ISLA-DTT's boundary read breaks the
# whole-model fullgraph trace. The blocks see the token count, which is the 200,000 boundary tokens plus the
# interior sample whenever a case has more boundary faces than that.
compile: false
compile_options:
  fullgraph: true
  dynamic: true
  options:                       # mode max-autotune-no-cudagraphs's options, with mix-order reduction off
    max_autotune: true           # (torch 2.12-2.13 miscompile it; see isla_volume_airfrans.yaml)
    coordinate_descent_tuning: true
    triton.mix_order_reduction: false

forward_kwargs:
  boundary_meshes:                    # Mesh[2, 3] each, at full resolution, normals into the fluid
    inlet: boundaries.inlet
    outlet: boundaries.outlet
    no_slip: boundaries.no_slip
    slip: boundaries.slip             # may have 0 faces on a case without slip walls (a condition without cells)
  prediction_points: interior         # the interior point-cloud Mesh
  global_data: global_data            # the case's TensorDict; the model selects its declared leaves

model:
  _target_: physicsnemo.experimental.models.isla.ISLA
  # The dataset's targets, by name and tensor rank, with their SI units and `scale` c, the typical size of the target
  # made dimensionless by ISLA's scales, so that the head's prediction is of order one: y = c yhat U^a L^b rho^e. c is
  # each split's: null here, it is the dataset file's isla_constants.output_scale (injected by train.py and infer.py),
  # the median over the split's train cases of the per-case RMS of the dimensionless target.
  output_schema:
    velocity: {rank: 1, units: {U: 1}, scale: null}                 # m/s
    pressure: {rank: 0, units: {U: 2, rho: 1}, scale: null}         # gauge pressure, Pa
    nut: {rank: 0, units: {U: 1, L: 1}, scale: null}                # m^2/s
    tke: {rank: 0, units: {U: 2}, scale: null}                      # m^2/s^2
    omega: {rank: 0, units: {U: 1, L: -1}, scale: null}             # 1/s
  # The boundary conditions by name, each with the fields it prescribes (SI units). Each input is divided by its units'
  # scale and then by its `scale` c_in, the split's typical size of the dimensionless input (null here: the dataset
  # file's isla_constants.input_scale, the median over the train cases of the per-case area-weighted RMS; a vector's
  # of its magnitude). The source's |v| / U has RMS 1 by construction and the outlet's gauge pressure is 0, so neither
  # takes one.
  boundary_schemas:
    inlet:                       # Dirichlet: prescribed.dirichlet.{velocity, turbulence}
      bc_velocity: {rank: 1, units: {U: 1}, velocity_scale: true}   # the source of U and g
      bc_tke: {rank: 0, units: {U: 2}, scale: null}
      bc_omega: {rank: 0, units: {U: 1, L: -1}, scale: null}
      bc_intermittency: {rank: 0, scale: null}                      # dimensionless
      bc_retheta: {rank: 0, scale: null}                            # dimensionless, ~ 200
    outlet:                      # prescribed.dirichlet.gauge_pressure and the prescribed.reverse_flow values
      bc_pressure: {rank: 0, units: {U: 2, rho: 1}}
      bc_velocity_reverse: {rank: 1, units: {U: 1}, scale: null}
      bc_tke_reverse: {rank: 0, units: {U: 2}, scale: null}
      bc_omega_reverse: {rank: 0, units: {U: 1, L: -1}, scale: null}
      bc_intermittency_reverse: {rank: 0, scale: null}
      bc_retheta_reverse: {rank: 0, scale: null}
    no_slip: {}                  # the bodies: a wall at rest (its prescribed velocity is zero)
    slip: {}                     # the slip walls
  global_schema:                 # no direction: g is derived from the inlet (K = 1)
    physics.density: {rank: 0, role: density}            # kg/m^3, consumed for the units only
    re_z: {rank: 0}              # (log10(U L / nu) - mean) / std, dataset_append_transforms above
  output_stats: null             # injected by train.py: the dataset's NormalizeMeshFields stats of the targets
  interior: true                 # predict at prediction_points: passive tokens that read the boundary (ISLA-DTT)
  n_boundary_tokens: 200000        # boundary tokens drawn per case inside the model, water-filled over the four roles (equal to the class default)
  hidden: 512                  # the reference configuration (REF-80 verdict, 2026-10-04): most accurate under 80 GiB per GPU on DrivAerML Surface and the 210-wing rung; equal to the class defaults
  n_layers: 12
  n_slices: 512
  # Run every slice block under torch.compile (PERF-3, 2026-10-01; built at the
  # first step, parameter names and checkpoints unchanged); see the comment on
  # `compile` above.
  compile_blocks: true
