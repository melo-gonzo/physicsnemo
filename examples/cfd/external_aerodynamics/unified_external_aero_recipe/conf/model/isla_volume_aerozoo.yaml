# ISLA, interior task, on AeroZoo v1.2 (datasets/aerozoo_volume.yaml): the reference configuration of
# isla_volume.yaml with the case's four boundaries (inlet, outlet, no_slip, slip) as four named boundary
# conditions (boundary_schemas). Each condition declares only the values it prescribes, read from its own
# mesh's cell_data (the dataset's prescribed.* fields under their recipe names, nondimensionalized): the
# inlet its velocity and turbulence values, the outlet its pressure and reverse-flow values, the no-slip
# and slip walls none. The condition's identity is in the model's parameters (its own input layer), so no
# role label is read, and the dataset's HarmonizeBoundaryFields (one-hot role labels and zero-filled
# copies of the other roles' fields, written for the one-declaration ISLA) is dropped for this model.
# The global inputs are the unit freestream direction, the standardized log Reynolds
# number and the inlet's four standardized turbulence quantities. No query_schema: each prediction point's
# geometry (its signed distance to the boundary surface, the union of the four meshes, and the direction from
# it) is computed inside the model from the exact closest point on their cells, positive in the fluid (the
# dataset files reorient the four boundaries, stored with their normals out of the fluid), so the dataset's
# stored sdf_wall / sdf_slip (GeoTransolver's inputs) are not read.
#
# The four boundaries go in at full resolution and ISLA draws its boundary tokens inside the model:
# `boundary_tokens` (200,000, the class default) per case, water-filled over the four roles (50,000 each when
# all four have more faces; a role with fewer is kept whole and its unused share goes to the others), each
# face drawn with probability proportional to its area and carrying its Horvitz-Thompson measure. So the
# datapipe's boundary subsampling is switched off for this model only (GeoTransolver keeps it):
# `dataset_reader_overrides` lifts the reader's per-boundary cap of the aerozoo_volume* files, and
# `dataset_drop_transforms` removes the aerozoo_uvolume* files' SubsampleMesh and the SDF passes only
# GeoTransolver reads.
dataset_reader_overrides:
  subsample_n_cells: null             # aerozoo_volume*: every boundary read whole
dataset_drop_transforms:
  - SubsampleMesh                     # aerozoo_uvolume*: the per-boundary 50,000-face cap
  - ComputeSDFFromBoundary            # sdf_wall / sdf_slip: GeoTransolver's inputs, not ISLA's
  - HarmonizeBoundaryFields           # the one-hot role labels and zero-filled fields: ISLA reads each condition's own
  - MergeBoundaries                   # aerozoo_puvolume*: GeoTransolver's face tokens, made from the harmonized fields
input_type: mesh
output_type: mesh

# Learning rate pinned at the reference configuration's rate, 3.75e-4 (REF-80
# verdict, 2026-10-04; the width rule 1e-3 x 192 / hidden at 512): the recipe
# default of 3e-3 drives the model to a mean-field plateau (book notebook:
# lrref-verdict; see isla_surface.yaml).
training:
  optimizer:
    lr: 3.75e-4

# Per-block compile here (compile_blocks below), not the whole-model compile of isla_volume.yaml: on
# AeroZoo's four boundaries the whole-model graph recompiles (2026-10-16): Dynamo's duck sizing ties
# boundaries with equal cell counts in the first case, and the input meshes' caches, whose contents differ
# by case with what the pipeline computed, are guarded by their size. The blocks see the token count, which
# is the 200,000 boundary tokens plus the interior sample whenever a case has more boundary faces than that.
# With compile=true model.compile_blocks=false the whole model compiles with these options.
compile: false
compile_options:
  fullgraph: true
  dynamic: true
  mode: max-autotune-no-cudagraphs

forward_kwargs:
  boundary_meshes:                    # Mesh[2, 3] each, at full resolution, normals into the fluid
    inlet: boundaries.inlet
    outlet: boundaries.outlet
    no_slip: boundaries.no_slip
    slip: boundaries.slip             # may have 0 faces on a case without slip walls (a condition without cells)
  prediction_points: interior         # the interior point-cloud Mesh
  global_data: global_data            # the case's TensorDict; the model selects its declared leaves

model:
  _target_: physicsnemo.experimental.models.isla.ISLA
  output_schema:                 # the dataset's targets, by name and tensor rank
    velocity: {rank: 1}
    pressure: {rank: 0}
    nut: {rank: 0}
    tke: {rank: 0}
    omega: {rank: 0}
  boundary_schemas:              # the boundary conditions by name, each with the fields it prescribes (nondimensional)
    inlet:                       # Dirichlet: prescribed.dirichlet.{velocity, turbulence}
      bc_velocity: {rank: 1}
      bc_tke: {rank: 0}
      bc_omega: {rank: 0}
      bc_intermittency: {rank: 0}
      bc_retheta: {rank: 0}
    outlet:                      # prescribed.dirichlet.gauge_pressure and the prescribed.reverse_flow values
      bc_pressure: {rank: 0}
      bc_velocity_reverse: {rank: 1}
      bc_tke_reverse: {rank: 0}
      bc_omega_reverse: {rank: 0}
      bc_intermittency_reverse: {rank: 0}
      bc_retheta_reverse: {rank: 0}
    no_slip: {}                  # the bodies: a wall at rest (its prescribed velocity is zero)
    slip: {}                     # the slip walls
  global_schema:
    U_inf_dir: {rank: 1}         # the unit freestream direction, read from global_data.U_inf_dir
    log_re_std: {rank: 0}        # (log10 Re - 5.5) / 1.5
    inlet_tke_std: {rank: 0}     # the inlet's turbulence quantities, standardized over the train split
    inlet_omega_std: {rank: 0}
    inlet_intermittency_std: {rank: 0}
    inlet_retheta_std: {rank: 0}
  interior: true                 # predict at prediction_points, which join the encoder as tokens
  boundary_tokens: 200000        # boundary tokens drawn per case inside the model, water-filled over the four roles (equal to the class default)
  hidden: 512                  # the reference configuration (REF-80 verdict, 2026-10-04): most accurate under 80 GiB per GPU on DrivAerML Surface and the 210-wing rung; equal to the class defaults
  n_layers: 12
  n_slices: 512
  # Run every slice block under torch.compile (PERF-3, 2026-10-01; built at the
  # first step, parameter names and checkpoints unchanged); see the comment on
  # `compile` above.
  compile_blocks: true
