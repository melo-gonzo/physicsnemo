# Transolver on the GINOT PLASTIC_LUG (ginot_lug_volume): the volume template (transolver_volume.yaml) with the interior
# inputs coordinates, stored signed distance and its gradient (the same wall geometry ISLA reads as query inputs) and the
# four standardized design parameters (global_data.params_std, written by the dataset's SplitGlobalVector) broadcast over
# the points as `fx`. Transolver has no boundary-token path, so the boundary conditions reach it only through the parameters
# (the pressure is one of them) and the geometry.
dataset_reader_overrides:
  drop_in_file_boundaries: true   # this point-based model consumes only the interior

input_type: tensors
output_type: tensors

forward_kwargs:
  embedding:
    - interior.points
    - interior.point_data.sdf
    - interior.point_data.sdf_normals
  fx:
    source: global_data.params_std
    expand_like: embedding

model:
  _target_: physicsnemo.models.transolver.Transolver
  out_dim: ${out_dim}     # 1 (von_mises), from the dataset's targets block
  functional_dim: 4       # fx = standardized [hole_radius, length, thickness, pressure]
  embedding_dim: 7        # embedding = points (3) + SDF (1) + SDF normals (3)
  n_layers: 12
  n_hidden: 256
  dropout: 0.0
  n_head: 8
  act: "gelu"
  mlp_ratio: 4
  slice_num: 256
  unified_pos: false
  structured_shape: null  # unstructured mesh
  use_te: false
  plus: false
  activation_checkpointing: false
  checkpointing_ratio: 1.0
