# Transolver on DeepJEB++ surface (deepjebpp_surface): the surface template (transolver_surface.yaml) with the per-cell
# inputs coordinates, outward normals, the clamped / loaded labels and the standardized traction vector bc_load (the same
# per-cell fields ISLA reads from the boundary mesh), and the case's load direction and load-type one-hot concatenated and
# broadcast over the cells as `fx`, as in geotransolver_surface_deepjebpp.yaml.
input_type: tensors
output_type: tensors

forward_kwargs:
  embedding:
    - interior.points
    - boundaries.surface.cell_data.normals
    - boundaries.surface.cell_data.bc_fixed
    - boundaries.surface.cell_data.bc_loaded
    - boundaries.surface.cell_data.bc_load
  fx:
    source:
      - global_data.load_dir
      - global_data.load_type
    expand_like: embedding

model:
  _target_: physicsnemo.models.transolver.Transolver
  out_dim: ${out_dim}     # 4 = von_mises (1) + displacement (3), from the dataset's targets block
  functional_dim: 5       # fx = load_dir (3) + load_type one-hot (2)
  embedding_dim: 11       # embedding = points (3) + normals (3) + bc_fixed (1) + bc_loaded (1) + bc_load (3)
  n_layers: 8
  n_hidden: 256
  dropout: 0.0
  n_head: 8
  act: "gelu"
  mlp_ratio: 4
  slice_num: 256
  unified_pos: false
  structured_shape: null  # unstructured mesh
  use_te: false
  plus: false
  activation_checkpointing: false
  checkpointing_ratio: 1.0
