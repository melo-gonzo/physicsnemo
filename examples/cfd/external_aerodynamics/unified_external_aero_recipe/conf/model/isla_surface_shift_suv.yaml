# ISLA, surface task, on the SHIFT-SUV datasets (shift_suv_*surface*): the reference configuration of isla_surface.yaml,
# reading the vehicle and the CFD box the datasets build (AddBoxBoundaries) and predicting at the vehicle's cells.
# The stored vehicle is wound with its normals into the fluid, as the box is built, so nothing is flipped (on
# DrivAerML, whose vehicle is wound into the body, isla_surface.yaml flips it).

input_type: mesh
output_type: mesh

training:
  optimizer:
    lr: 3.75e-4

compile: true
compile_options:
  fullgraph: true
  dynamic: true
  options:                       # mode max-autotune-no-cudagraphs's options, with mix-order reduction off
    max_autotune: true           # (torch 2.12-2.13 miscompile it; see isla_volume_airfrans.yaml)
    coordinate_descent_tuning: true
    triton.mix_order_reduction: false

forward_kwargs:
  boundary_meshes:                    # Mesh[2, 3] each; centroids, normals and measures are read from them
    vehicle: boundaries.vehicle       # the subsampled vehicle surface, with its Horvitz-Thompson measures
    inlet: boundaries.inlet           # the CFD box, whole, as the dataset builds it
    outlet: boundaries.outlet
    floor: boundaries.floor
    side_walls: boundaries.side_walls
    roof: boundaries.roof
  prediction_boundaries: {literal: [vehicle]}   # the outputs are predicted at the vehicle's cells only
  global_data: global_data            # the case's TensorDict; the model selects its declared leaves

model:
  _target_: physicsnemo.experimental.models.isla.ISLA
  output_schema:                 # the dataset's targets, by name and tensor rank (0 scalar, 1 vector)
    pressure: {rank: 0}
    wss: {rank: 1}
  boundary_schemas:              # the boundary conditions by name, each with its own per-cell fields
    vehicle: {}                  # the vehicle surface, no-slip with rotating wheels: no per-cell fields
    inlet: {}                    # the box's pieces carry no field: each condition is its name
    outlet: {}
    floor: {}
    side_walls: {}
    roof: {}
  global_schema:
    U_inf_dir: {rank: 1}         # a rank-1 global input, read from global_data.U_inf_dir; normalized to a unit direction inside the model
  hidden: 512                  # the reference configuration (REF-80 verdict, 2026-10-04): most accurate under 80 GiB per GPU on DrivAerML Surface and the 210-wing rung; equal to the class defaults
  n_layers: 12
  n_slices: 512
  # Per-block torch.compile (PERF-3, 2026-10-01): off, since the recipe compiles
  # the whole model (compile_options above). The way to compile ISLA-DTT (the
  # interior task), whose boundary read breaks the whole-model graph.
  compile_blocks: false
