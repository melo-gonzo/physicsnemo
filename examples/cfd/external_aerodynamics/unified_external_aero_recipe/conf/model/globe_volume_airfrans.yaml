# GLOBE, interior task, on AirfRANS (pair with datasets/airfrans_uvolume_2d.yaml, the file ISLA's lanes read), at the
# paper's AirfRANS configuration (arXiv:2511.15856, App. E, Table 8: 117,282 parameters with the paper's five output
# fields; with the recipe's three fields the count is printed at start-up). GLOBE-SCORE, 2026-10-19.
#
# Inputs, the same information as ISLA's: the airfoil polyline (Mesh[1, 2] after RestrictToPlane; GLOBE computes its
# cell normals from the geometry and reads no other boundary field), the unit freestream direction U_inf_dir (rank 1),
# and the case's Reynolds number, which GLOBEFreestream turns into the paper's reference lengths {chord = 1,
# delta_FS = chord / sqrt(Re)}. Not given: the stored sdf / sdf_normals ISLA and GeoTransolver read per query (the
# paper excludes them; GLOBE computes its geometry from the boundary itself).
# Output: GLOBE's velocity deficit plus U_inf_dir, i.e. the recipe's target U / |U_inf| (see src/globe_freestream.py).
input_type: mesh
output_type: mesh

forward_kwargs:
  prediction_points: interior.points          # (N, 2) query coordinates
  boundary_meshes:
    airfoil: boundaries.airfoil               # Mesh[1, 2]: line cells after RestrictToPlane
  global_data: global_data                    # the case's TensorDict; GLOBE keeps its declared leaves, the wrapper reads Re

model:
  _target_: globe_freestream.GLOBEFreestream
  n_spatial_dims: 2
  output_schema:
    velocity: {rank: 1}
    pressure: {rank: 0}
    nut: {rank: 0}
  boundary_source_schemas:
    airfoil: {}
  reference_length_names: [chord, delta_FS]
  reference_area: 1.0                         # chord^2 (positions in chords)
  global_schema:
    U_inf_dir: {rank: 1}
  n_communication_hyperlayers: 2              # paper Table 8 / examples/cfd/external_aerodynamics/globe/airfrans/train.py
  hidden_layer_sizes: [64, 64, 64]            # paper: 3 layers of 64 (117,282 parameters); the example's default is 128
  n_latent_scalars: 12
  n_latent_vectors: 6
  n_spherical_harmonics: 1
  theta: 0.0                                  # exact summation, as the AirfRANS example
  leaf_size: 1
  network_type: pade
  self_regularization_beta: 0.01
  latent_compression_scale: 100.0
  expand_far_targets: true
  velocity_field: velocity
  freestream_field: U_inf_dir
  reynolds_field: Re
  chord: 1.0
