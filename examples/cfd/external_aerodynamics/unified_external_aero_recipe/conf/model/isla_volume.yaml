# ---------------------------------------------------------------------------
# ISLA -- INTERIOR (volume) task (reference configuration).
# ---------------------------------------------------------------------------
# Boundary -> interior on DrivAerML volume data. Interior task
# (`interior: true`): the outputs are predicted at `prediction_points`, the
# dataset's interior point cloud passed as a Mesh; the prediction points join
# the encoder as interacting tokens. The same mesh contract as
# isla_surface.yaml otherwise: the boundary as named Mesh objects (centroids,
# normals and measures read from the Mesh), the case's global data as a
# TensorDict, one case per call; the output is a point-cloud Mesh at the
# prediction points with the output_schema fields in its point_data.
#
# The vehicle boundary is the full-resolution surface (the reference dataset
# files read it whole, its normals reoriented into the fluid). Each prediction
# point's built-in geometry, its signed distance to that surface and the
# direction from it, is computed inside the model from the exact closest point
# on its cells (positive in the fluid) and is never an input. The boundary
# tokens are drawn from the same cells inside the model: `boundary_tokens`
# (200,000, the class default) cells with probability proportional to their
# area, each carrying its Horvitz-Thompson measure, so the measure-weighted
# reads are quadratures of the whole surface; a uniform draw per step in
# training, a fixed one in evaluation. This configuration declares no
# `query_schema`, so the dataset's stored sdf / sdf_normals are not read;
# isla_volume_sdf.yaml declares them as query inputs. Pair this model config
# with datasets/drivaer_ml_volume_reference.yaml, which also writes the unit
# freestream direction `U_inf_dir` the model reads.
input_type: mesh
output_type: mesh

# Learning rate pinned at the reference configuration's rate, 3.75e-4 (REF-80
# verdict, 2026-10-04; the width rule 1e-3 x 192 / hidden at 512): the recipe
# default of 3e-3 drives the model to a mean-field plateau (book notebook:
# lrref-verdict; see isla_surface.yaml).
training:
  optimizer:
    lr: 3.75e-4

# Whole-model torch.compile, the fastest way to run ISLA: the forward, Mesh in
# and out, traces to one graph with no breaks (fullgraph) and compiles once with
# dynamic shapes for every token count, so the case-to-case change in boundary
# and point counts does not recompile (the in-model boundary draw's token count,
# min(cells, boundary_tokens), is a symbolic size of the same graph; one
# exception: boundaries with equal cell counts in the first case are tied by
# Dynamo's duck sizing, and the first case where they differ compiles once more;
# validation, in evaluation mode, compiles its own graph). max-autotune-no-cudagraphs on purpose:
# plain max-autotune also captures CUDA graphs, which are static-shape and would
# record a new graph for every token count; at training sizes dynamic shapes are
# faster than padding the cases to CUDA-graph size buckets. The first compile
# is long (about 11 minutes on a cold cache for DrivAerML Surface on a GB300,
# a minute from a warm one): keep TORCHINDUCTOR_CACHE_DIR and TRITON_CACHE_DIR
# across the links of a chained run. Not with
# model.query_independent=true (ISLA-DTT): its boundary read breaks the graph;
# there set compile=false and model.compile_blocks=true.
compile: true
compile_options:
  fullgraph: true
  dynamic: true
  mode: max-autotune-no-cudagraphs

forward_kwargs:
  boundary_meshes:
    vehicle: boundaries.vehicle       # Mesh[2, 3]: the full-resolution vehicle surface, normals into the fluid
  prediction_points: interior         # the interior point-cloud Mesh (its point_data carries any query_schema fields)
  global_data: global_data            # the case's TensorDict; the model selects its declared leaves

model:
  _target_: physicsnemo.experimental.models.isla.ISLA
  output_schema:                 # the dataset's targets, by name and tensor rank
    velocity: {rank: 1}
    pressure: {rank: 0}
    nut: {rank: 0}
  global_schema:
    U_inf_dir: {rank: 1}         # the unit freestream direction, read from global_data.U_inf_dir
  interior: true                 # predict at prediction_points, which join the encoder as tokens
  boundary_tokens: 200000        # boundary tokens drawn per case inside the model (equal to the class default)
  hidden: 512                  # the reference configuration (REF-80 verdict, 2026-10-04): most accurate under 80 GiB per GPU on DrivAerML Surface and the 210-wing rung; equal to the class defaults
  n_layers: 12
  n_slices: 512
  # Per-block torch.compile (PERF-3, 2026-10-01): off, since the recipe compiles
  # the whole model (compile_options above). The way to compile ISLA-DTT
  # (model.query_independent=true), whose boundary read breaks the whole-model graph.
  compile_blocks: false
