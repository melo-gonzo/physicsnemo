# ---------------------------------------------------------------------------
# ISLA -- INTERIOR (volume) task (reference configuration).
# ---------------------------------------------------------------------------
# Boundary -> interior on DrivAerML volume data. Interior task
# (`interior: true`): the outputs are predicted at `prediction_points`, the
# dataset's interior point cloud passed as a Mesh; the prediction points join
# the encoder as interacting tokens. The same mesh contract as
# isla_surface.yaml otherwise: the boundary as named Mesh objects (centroids,
# normals and measures read from the Mesh), the case's global data as a
# TensorDict, one case per call; the output is a point-cloud Mesh at the
# prediction points with the declared outputs in its point_data.
#
# Each prediction point's built-in geometry, its signed distance to the
# nearest boundary token and the direction to it, is computed inside the
# model from the boundary sample and is never an input; this configuration
# declares no `query_inputs`, so the dataset's stored sdf / sdf_normals are
# not read. isla_volume_sdf.yaml declares them as query inputs (the stored
# field is computed on the full mesh, the internal one on the 200,000-cell
# sample; the INTERNAL-GEOMETRY measurement).
#
# The boundary measure must sum to the surface area: a subsampled boundary's
# raw cell areas sum to the kept fraction of it, so the model reads the
# Horvitz-Thompson corrected `cell_data._effective_measure` that the reader's
# cell subsample writes and `ComposeQuadratureMeasure` materializes in
# datasets/drivaer_ml_volume_reference.yaml. Pair this model config with
# that dataset config.
input_type: mesh
output_type: mesh

# Learning rate pinned at the reference configuration's rate, 5e-4 (REF
# verdict, 2026-09-23; the width rule 1e-3 x 192 / hidden at 384): the recipe
# default of 3e-3 drives the model to a mean-field plateau (book notebook:
# lrref-verdict; see isla_surface.yaml).
training:
  optimizer:
    lr: 5.0e-4

forward_kwargs:
  boundary_meshes:
    vehicle: boundaries.vehicle       # Mesh[2, 3] with the corrected cell measure in cell_data
  prediction_points: interior         # the interior point-cloud Mesh (its point_data carries any declared query_inputs)
  global_data: global_data            # the case's TensorDict; the model selects its declared leaves

model:
  _target_: physicsnemo.experimental.models.ISLA
  outputs:                       # the dataset's targets, by name and tensor rank
    velocity: {rank: 1}
    pressure: {rank: 0}
    nut: {rank: 0}
  global_inputs:
    U_inf_dir: {rank: 1}         # the unit freestream direction, read from global_data.U_inf_dir
  interior: true                 # predict at prediction_points, which join the encoder as tokens
  hidden: 384                  # the reference configuration (REF verdict, 2026-09-23); also the class defaults
  n_layers: 12
  n_slices: 256
  mlp_ratio: 4
  geo_checkpoint: true
  # Geometry kernel: null = automatic: the exact fused Triton kernel wherever
  # it can run (CUDA, one to four per-point vectors, <= 1024 slices, no rank-2
  # per-token inputs), the eager PyTorch region otherwise. Force with `eager`
  # or `fused`.
  geo_kernel: null
