# ---------------------------------------------------------------------------
# ISLA -- INTERIOR (volume) task (reference configuration).
# ---------------------------------------------------------------------------
# Boundary -> interior on DrivAerML volume data. Interior task
# (`interior: true`): the outputs are predicted at `prediction_points`, the
# dataset's interior point cloud passed as a Mesh. The model is ISLA-DTT, the
# interior task's one form: the prediction points are passive tokens, which
# read the slices the boundary forms at every depth without writing into them
# and after every block read every boundary cell, so each prediction depends on
# its own point and the boundary alone. The same mesh contract as
# isla_surface.yaml otherwise: the boundary as named Mesh objects (centroids,
# normals and measures read from the Mesh), the case's global data as a
# TensorDict, one case per call; the output is a point-cloud Mesh at the
# prediction points with the output_schema fields in its point_data.
#
# The boundary is the whole boundary of the PDE's domain, every mesh the case
# files store, each a boundary condition by its name in the file (as on AeroZoo,
# isla_volume_aerozoo.yaml):
#
#   vehicle   the car, a no-slip wall (the dataset file reverses its stored
#             winding, which points into the body);
#   no_slip   the ground under the car and downstream (x = -2.34 m to the
#             outlet, the full span, at the wheels' contact height);
#   slip      the domain's slip walls: the two sides, the roof and the ground
#             upstream of no_slip;
#   inlet     the upstream face of the domain box (x = -40 m);
#   outlet    the downstream face (x = 80 m).
#
# The files store no cell data on the four domain meshes, so none declares a
# field; their stored faces point into the fluid on every case, so they are read
# as stored. Each is read whole at full resolution. Each prediction point's
# built-in geometry, its signed distance to the union of the five surfaces and
# the direction from it, is computed inside the model from the exact closest
# point on their cells (positive in the fluid) and is never an input. The
# boundary tokens are drawn from the same cells inside the model:
# `boundary_tokens` (200,000, the class default) cells, shared over the five by
# water filling (the domain meshes, a few thousand faces, are kept whole), with
# probability proportional to their area, each carrying its Horvitz-Thompson
# measure, so the measure-weighted reads are quadratures of the whole boundary;
# a uniform draw per step in training, a fixed one in evaluation. The length
# unit is taken from all five, so the domain, not the car, sets it. This
# configuration declares no `query_schema`, so the dataset's stored sdf /
# sdf_normals (the baselines' inputs) are not read. Pair this model config
# with datasets/drivaer_ml_volume_reference.yaml, which also writes the unit
# freestream direction `U_inf_dir` the model reads.
input_type: mesh
output_type: mesh

# Learning rate pinned at the reference configuration's rate, 3.75e-4 (REF-80
# verdict, 2026-10-04; the width rule 1e-3 x 192 / hidden at 512): the recipe
# default of 3e-3 drives the model to a mean-field plateau (book notebook:
# lrref-verdict; see isla_surface.yaml).
training:
  optimizer:
    lr: 3.75e-4

# Per-block torch.compile (model.compile_blocks below), not the whole-model
# compile: ISLA-DTT's boundary read sizes its pairs from the data and breaks the
# whole-model fullgraph trace. The compile_options kept below are the
# whole-model compile's, the surface task's (the surface configs point here),
# the fastest way to run it: the forward, Mesh in and out, traces to one graph
# with no breaks (fullgraph) and compiles once with dynamic shapes for every
# token count, so the case-to-case change in boundary counts does not recompile
# (one exception: boundaries with equal cell counts in the first case are tied by
# Dynamo's duck sizing, and the first case where they differ compiles once more;
# validation, in evaluation mode, compiles its own graph). The options of max-autotune-no-cudagraphs on purpose
# (mix-order reduction off, see isla_volume_airfrans.yaml): plain max-autotune also captures CUDA graphs, which are static-shape and would
# record a new graph for every token count; at training sizes dynamic shapes are
# faster than padding the cases to CUDA-graph size buckets. The first compile
# is long (about 11 minutes on a cold cache for DrivAerML Surface on a GB300,
# a minute from a warm one): keep TORCHINDUCTOR_CACHE_DIR and TRITON_CACHE_DIR
# across the links of a chained run.
compile: false
compile_options:
  fullgraph: true
  dynamic: true
  options:                       # mode max-autotune-no-cudagraphs's options, with mix-order reduction off
    max_autotune: true           # (torch 2.12-2.13 miscompile it; see isla_volume_airfrans.yaml)
    coordinate_descent_tuning: true
    triton.mix_order_reduction: false

forward_kwargs:
  boundary_meshes:
    vehicle: boundaries.vehicle       # Mesh[2, 3] each, full resolution, normals into the fluid
    no_slip: boundaries.no_slip
    slip: boundaries.slip
    inlet: boundaries.inlet
    outlet: boundaries.outlet
  prediction_points: interior         # the interior point-cloud Mesh (its points)
  global_data: global_data            # the case's TensorDict; the model selects its declared leaves

model:
  _target_: physicsnemo.experimental.models.isla.ISLA
  output_schema:                 # the dataset's targets, by name and tensor rank
    velocity: {rank: 1}
    pressure: {rank: 0}
    nut: {rank: 0}
  boundary_schemas:              # the boundary conditions by name, each with its own per-cell fields
    vehicle: {}                  # the vehicle surface, a no-slip wall: no per-cell fields
    no_slip: {}                  # the ground, a no-slip wall: no per-cell fields
    slip: {}                     # the slip walls: no per-cell fields
    inlet: {}                    # the inlet face: no per-cell fields (the files store no prescribed values)
    outlet: {}                   # the outlet face: no per-cell fields
  global_schema:
    U_inf_dir: {rank: 1}         # the unit freestream direction, read from global_data.U_inf_dir
  interior: true                 # predict at prediction_points: passive tokens that read the boundary (ISLA-DTT)
  boundary_tokens: 200000        # boundary tokens drawn per case inside the model (equal to the class default)
  hidden: 512                  # the reference configuration (REF-80 verdict, 2026-10-04): most accurate under 80 GiB per GPU on DrivAerML Surface and the 210-wing rung; equal to the class defaults
  n_layers: 12
  n_slices: 512
  # Per-block torch.compile (PERF-3, 2026-10-01; built at the first step, parameter
  # names and checkpoints unchanged): the way to compile ISLA-DTT, whose boundary
  # read breaks the whole-model fullgraph trace; see the comment on `compile` above.
  compile_blocks: true
