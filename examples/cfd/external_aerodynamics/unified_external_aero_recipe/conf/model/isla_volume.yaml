# ---------------------------------------------------------------------------
# ISLA -- INTERIOR (volume) recipe (reference configuration).
# ---------------------------------------------------------------------------
# Boundary -> interior on DrivAerML volume data (decided 2026-09-14, book
# notebook #sec-nb-relint-verdict): the interior query points are admitted as
# interacting tokens, on the same frame-free construction as the surface configuration
# (isla_surface.yaml): no frame origin (no centroid anywhere; positions
# enter only as point-to-anchor differences) and scale_mode=rms_distance
# (length unit = measure-weighted RMS pairwise distance of the boundary
# sample; scale_mode=total_measure, the square root of the total boundary
# quadrature measure, remains an option and is the unit of runs before
# 2026-09-18).
#
# Both units need measure weights whose sum is the surface
# area. A subsampled boundary's raw cell_areas sum to the kept fraction of
# it, so this config reads the Horvitz-Thompson-corrected measure written by
# the ComposeQuadratureMeasure transform of datasets/drivaer_ml_volume_reference.yaml
# (notebook #sec-nb-relint-void for what goes wrong without it). Pair this
# model config with that dataset config.
#
# Interior geometry (2026-09-23): each query's direction and signed wall
# distance are computed inside the model from the boundary sample (the
# nearest boundary cell; interior_geometry=nearest_boundary, the class
# default), so the dataset's stored sdf / sdf_normals are not read. The
# stored field is computed on the full mesh and the internal one on the
# 200,000-cell sample; isla_volume_provided.yaml keeps the stored field
# (interior_geometry=provided) for the INTERNAL-GEOMETRY measurement.
#
# Standing at the 192-wide, 1e-3 protocol of the time (float32, 48 DrivAerML
# validation cars, 10,000 queries, two seeds,
# results/relint2_reduction_2026-09-14.json): pressure 0.0550, velocity 0.0782,
# eddy viscosity 0.1005; 1.000x / 0.990x / 0.880x of the similarity-gauge
# interior configuration it replaces.
# Naming note: until 2026-09-15 this file was isla_volume_reference.yaml, which
# is now a pointer to this file.
input_type: tensors
output_type: fields

# Learning rate pinned at the reference configuration's rate, 5e-4 (REF
# verdict, 2026-09-23; the width rule 1e-3 x 192 / hidden at 384): the recipe
# default of 3e-3 drives the relative frame to a mean-field plateau (book
# notebook: lrref-verdict; see isla_surface.yaml).
training:
  optimizer:
    lr: 5.0e-4

forward_kwargs:
  points: boundaries.vehicle.cell_centroids
  normals: boundaries.vehicle.cell_normals
  measure_weights: boundaries.vehicle.cell_data._effective_measure
  global_inputs:
    freestream: global_data.U_inf_dir   # the one global direction of external aerodynamics
  query_points: interior.points        # direction and wall distance are derived inside the model

model:
  _target_: physicsnemo.experimental.models.ISLA
  outputs:                       # the dataset's targets, by name and tensor rank
    velocity: 1
    pressure: 0
    nut: 0
  global_inputs:
    freestream: 1
  hidden: 384                  # the reference configuration (REF verdict, 2026-09-23); also the class defaults
  n_layers: 12
  n_slices: 256
  mlp_ratio: 4
  scale_mode: rms_distance
  query_tokens: true
  # Interior tokens share a learned fraction of the total boundary measure (the class
  # default since 2026-09-20; invariant to how the boundary measure is represented).
  # Interior lanes trained before that date used query_mass: geometric_mean.
  query_mass: source_total
  geo_checkpoint: true
  # Geometry kernel: null = automatic (2026-09-19 ruling): the exact fused Triton kernel
  # wherever it can run (CUDA, one global direction, <= 1024 slices, no rank-1/2 per-token
  # inputs), the eager PyTorch region otherwise. Force with `eager` or `fused`.
  geo_kernel: null
