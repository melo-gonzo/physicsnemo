# ISLA interior configuration with the dataset's stored wall geometry as
# declared query inputs: the signed distance `sdf` (rank 0) and its gradient
# `sdf_normals` (rank 1), both computed on the full mesh by the dataset's
# ComputeSDFFromBoundary stage and read from the prediction Mesh's
# point_data (`prediction_points: interior`, inherited). They enter like any
# other per-point PDE data; the model's own nearest-boundary geometry is
# still computed from the boundary sample. Everything else is
# isla_volume.yaml. This variant exists for the INTERNAL-GEOMETRY
# measurement (book notebook #sec-nb-internal-geometry-prereg).
defaults:
  - isla_volume

model:
  query_inputs:
    sdf: 0                       # rank-0 per-point input: a length, scaled by the frame's length unit inside the model
    sdf_normals: 1               # rank-1 per-point input: the stored SDF gradient, never scaled
