# ---------------------------------------------------------------------------
# GeoTransolver template -- VOLUME recipe for AirfRANS.
# ---------------------------------------------------------------------------
# Pair with datasets/airfrans_uvolume_ud.yaml (and its _area / _posed
# scoring twins). The interior inputs are the volume template's
# (coordinates, signed distance and its direction) at the surface-style
# scale with the local-feature path off, the configuration of the AirfRANS
# lanes (AIRFRANS-INT, 2026-09-21).
#
# Freestream input (the drive rule, 2026-10-18): the unit freestream
# direction U_inf_dir and, because the AirfRANS speed varies per case
# (31-94 m/s), the standardized speed U_inf_mag_std, never the raw U_inf
# vector. U_inf_dir is stored in the case files; U_inf_mag_std is written
# by the _ud datasets' SplitGlobalVector with fixed full_train constants.
# The constant-speed datasets need no magnitude channel and use
# geotransolver_volume.yaml / geotransolver_surface.yaml instead.
dataset_reader_overrides:
  # This point-based model consumes only the volume interior.
  drop_in_file_boundaries: true

input_type: tensors
output_type: tensors

forward_kwargs:
  geometry: interior.points
  local_embedding:
    - interior.points
    - interior.point_data.sdf
    - interior.point_data.sdf_normals
  local_positions: interior.points
  global_embedding:
    - global_data.U_inf_dir
    - global_data.U_inf_mag_std

model:
  _target_: physicsnemo.models.geotransolver.GeoTransolver
  out_dim: ${out_dim}     # auto-set from the chosen dataset's `targets:` block
  functional_dim: 7       # local_embedding = coords (3) + SDF (1) + SDF normals (3)
  geometry_dim: 3         # point coordinates
  global_dim: 4           # U_inf_dir (3) + U_inf_mag_std (1)
  n_layers: 12
  n_hidden: 256
  dropout: 0.0
  n_head: 8
  act: "gelu"
  mlp_ratio: 4
  slice_num: 256
  use_te: false
  plus: false
  include_local_features: false
  radii: [0.1, 0.5, 2.0]
  neighbors_in_radius: [16, 32, 64]
  n_hidden_local: 32
  activation_checkpointing: false
  checkpointing_ratio: 1.0
  activation_checkpointing_components: [blocks]
