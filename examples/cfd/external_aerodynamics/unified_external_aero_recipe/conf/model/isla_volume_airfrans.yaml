# ISLA, interior task, on AirfRANS (airfrans_uvolume_2d, the uniform protocol): the reference configuration of isla_volume.yaml in two
# dimensions, with the whole boundary of the PDE domain (the airfoil and the far field) and the farfield velocity
# U_inf as the global input.
#
# ISLA brings its own scales (the model's docstring, *Scales*): the length L is the RMS pairwise distance of
# the whole boundary, which the far field sets (305.3 chords; the airfoil's alone is 0.41-0.44), the velocity U = |U_inf| (the farfield Dirichlet value, the global
# field that `defines: U`, whose direction is the one global direction, K = 1); with nu the air's kinematic
# viscosity, the constant 1.56e-5 m^2/s (SetGlobalField below; AirfRANS varies Re through U_inf alone), the
# standardized log10(U L / nu), computed by the recipe (below), is a global scalar in place of the raw speed in m/s. The velocity and pressure
# outputs are dimensionless because the dataset's NonDimensionalizeByMetadata divides the targets by the same
# |U_inf| that ISLA takes as its U (v / |U_inf| and Cp = p / (0.5 |U_inf|^2)); nut (m^2/s) has the units U L
# and is standardized by the dataset's NormalizeMeshFields stats (output_stats, injected by train.py). The
# targets and the loss are every arm's.

# The mesh contract is that of isla_volume.yaml: no query_schema, so the dataset's
# stored sdf and sdf_normals (the baselines' inputs) are not read; each prediction
# point's distance and direction to the airfoil are computed inside the model,
# exactly, from the boundary meshes. The AirfRANS files read the airfoil whole (843 to 1,217 segments, normals pointing into the
# fluid) and the dataset's reader adds the far field from the raw release (AF-WHOLE, 2026-10-23: 1,563 to 1,923
# segments, normals into the fluid; the interior is the release's crop, whose edges are not a boundary of the PDE);
# together they are below the 200,000-token budget, so every segment is a boundary token with its own length.
input_type: mesh
output_type: mesh

# The kinematic viscosity of air, a physical constant (the files carry none), as the global leaf nu; run after
# the dataset's own chain. Then ISLA's Reynolds number, computed here rather than in the model (2026-10-24): on the
# meshes the model receives, L (the whole boundary's RMS pairwise distance) and U = |U_inf| exactly as ISLA computes
# its scales, then re_z = (log10(U L / nu) - mean) / std in float64. mean and std are null here: src/datasets.py
# fills them from the dataset file's isla_constants.reynolds, fitted on the split's train cases.
dataset_append_transforms:
  - _target_: ${dp:SetGlobalField}
    fields:
      nu: 1.56e-5
  - _target_: ${dp:ComputeBoundaryScales}
    boundaries: [airfoil, freestream]    # forward_kwargs.boundary_meshes
    length_field: L
    speed_field: U
    global_source: U_inf
  - _target_: ${dp:ComputeLogReynolds}
    speed_field: U
    length_field: L
    viscosity_field: nu
    mean: null
    std: null
    output_field: log_re
    standardized_field: re_z

# Learning rate pinned at the reference configuration's rate, 3.75e-4 (REF-80
# verdict, 2026-10-04; the width rule 1e-3 x 192 / hidden at 512): the recipe
# default of 3e-3 drives the model to a mean-field plateau (book notebook:
# lrref-verdict; see isla_surface.yaml).
training:
  optimizer:
    lr: 3.75e-4

# Per-block torch.compile (model.compile_blocks below): ISLA-DTT's boundary read breaks the whole-model
# fullgraph trace. The compile_options below are the whole-model compile's (see isla_volume.yaml): those
# of mode max-autotune-no-cudagraphs (max_autotune and
# coordinate_descent_tuning) with Inductor's mix-order reduction off: on the whole-model graph it fuses a per-point sum with a sum over the
# points into one kernel, and torch 2.12 returns the second sum, a (1, n_slices, 1) softmax denominator
# saved for backward, as (1, n_slices), so the compiled backward fails its first step ("wrong number
# of dimensions"). torch 2.13 returns it at its shape, but its mix-order column sums still add the padded
# rows after a prologue such as exp, a silent error (pytorch/pytorch#195845, fixed on main on 2026-09-29):
# the mode line can come back with a torch that has both fixes.
compile: false
compile_options:
  fullgraph: true
  dynamic: true
  options:
    max_autotune: true
    coordinate_descent_tuning: true
    triton.mix_order_reduction: false

forward_kwargs:
  boundary_meshes:
    airfoil: boundaries.airfoil       # Mesh[1, 2] after RestrictToPlane: line cells with in-plane normals and segment lengths
    freestream: boundaries.freestream # Mesh[1, 2]: the far field, line cells (the reader's vtk_boundaries)
  prediction_points: interior         # the interior point-cloud Mesh
  global_data: global_data            # the case's TensorDict; the model selects its declared leaves

model:
  _target_: physicsnemo.experimental.models.isla.ISLA
  output_schema:                 # the dataset's targets, by name and tensor rank, with their units
    velocity: {rank: 1}          # v / |U_inf|: dimensionless (NonDimensionalizeByMetadata divides by ISLA's U)
    pressure: {rank: 0}          # Cp: dimensionless, likewise
    nut: {rank: 0, units: {U: 1, L: 1}, scale: null}   # m^2/s; c from the dataset file's isla_constants (train.py)
  boundary_schemas:              # the boundary conditions by name, each with its own per-cell fields
    airfoil: {}                  # the airfoil, a no-slip wall: no per-cell fields
    freestream: {}               # the far field, OpenFOAM's freestream condition from U_inf (the global input): no per-cell fields
  global_schema:
    U_inf: {rank: 1, units: {U: 1}, defines: U}             # the farfield velocity (m/s): U = |U_inf|, g its direction
    re_z: {rank: 0}              # (log10(U L / nu) - mean) / std, dataset_append_transforms above
  output_stats: null             # injected by train.py: the dataset's NormalizeMeshFields stats (nut)
  n_spatial_dims: 2                       # the problem is planar: pair with datasets/airfrans_uvolume_2d.yaml (RestrictToPlane first after the uniform draw)
  interior: true                 # predict at prediction_points: passive tokens that read the boundary (ISLA-DTT)
  n_boundary_tokens: 200000        # boundary tokens drawn per case inside the model (equal to the class default; the airfoil is kept whole)
  hidden: 512                  # the reference configuration (REF-80 verdict, 2026-10-04): most accurate under 80 GiB per GPU on DrivAerML Surface and the 210-wing rung; equal to the class defaults
  n_layers: 12
  n_slices: 512
  # Per-block torch.compile (PERF-3, 2026-10-01): the way to compile ISLA-DTT, whose
  # boundary read breaks the whole-model fullgraph trace; see the comment on `compile` above.
  compile_blocks: true
