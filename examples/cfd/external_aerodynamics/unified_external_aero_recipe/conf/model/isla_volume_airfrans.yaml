# ISLA, interior task, on AirfRANS (airfrans_volume_2d): the reference configuration of isla_volume.yaml in two
# dimensions, with the airfoil boundary, the inlet direction and speed as global inputs and the stored signed
# distance and its gradient as per-query inputs.

# The mesh contract is that of isla_volume.yaml; unlike it, this config also
# reads the dataset's stored sdf and sdf_normals as query inputs.
input_type: mesh
output_type: mesh

# Learning rate pinned at the reference configuration's rate, 3.75e-4 (REF-80
# verdict, 2026-10-04; the width rule 1e-3 x 192 / hidden at 512): the recipe
# default of 3e-3 drives the model to a mean-field plateau (book notebook:
# lrref-verdict; see isla_surface.yaml).
training:
  optimizer:
    lr: 3.75e-4

# Whole-model torch.compile: one graph, compiled once for every token count; see isla_volume.yaml.
compile: true
compile_options:
  fullgraph: true
  dynamic: true
  mode: max-autotune-no-cudagraphs

forward_kwargs:
  boundary_meshes:
    airfoil: boundaries.airfoil       # Mesh[1, 2] after RestrictToPlane: line cells with in-plane normals and segment lengths
  prediction_points: interior         # the interior point-cloud Mesh (its point_data carries any query_schema fields)
  global_data: global_data            # the case's TensorDict; the model selects its declared leaves

model:
  _target_: physicsnemo.experimental.models.isla.ISLA
  output_schema:                 # the dataset's targets, by name and tensor rank
    velocity: {rank: 1}
    pressure: {rank: 0}
    nut: {rank: 0}
  global_schema:
    U_inf_dir: {rank: 1}         # the unit inlet direction, read from global_data.U_inf_dir
    U_inf_mag: {rank: 0}         # the inlet speed, a rank-0 global input (the Reynolds number varies across cases)
  query_schema:
    sdf: {rank: 0}               # the stored signed distance to the airfoil (a length, scaled by the frame's length unit inside the model)
    sdf_normals: {rank: 1}       # the stored SDF gradient, in the plane after RestrictToPlane
  dim: 2                         # the problem is planar: pair with datasets/airfrans_volume_2d.yaml (RestrictToPlane first in its pipeline)
  interior: true                 # predict at prediction_points, which join the encoder as tokens
  hidden: 512                  # the reference configuration (REF-80 verdict, 2026-10-04): most accurate under 80 GiB per GPU on DrivAerML Surface and the 210-wing rung; equal to the class defaults
  n_layers: 12
  n_slices: 512
  mlp_ratio: 4
  geo_checkpoint: true
  # Geometry kernel: null = automatic: the exact fused Triton kernel wherever
  # it can run (CUDA, one to four per-point vectors, <= 1024 slices, no rank-2
  # per-token inputs), the eager PyTorch region otherwise. Force with `eager`
  # or `fused`.
  geo_kernel: null
  # Per-block torch.compile (PERF-3, 2026-10-01): off, since the recipe compiles
  # the whole model (compile_options above). The way to compile ISLA-DTT
  # (model.kernel_read), whose reads break the whole-model graph.
  compile_blocks: false
