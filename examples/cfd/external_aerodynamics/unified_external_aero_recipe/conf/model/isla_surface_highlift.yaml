# ISLA, surface task, on the HiLift wing datasets (highlift_surface_*): the reference configuration of isla_surface.yaml
# with the wings' five cell targets (pressure, temperature, density scalars; velocity and wall shear vectors), reading
# the wing (its duplicated cells dropped by the dataset's reader) and the hemisphere far field the dataset builds
# (AddHemisphereBoundaries: inlet, outlet), and predicting at the wing's cells.
# The domain's third boundary, the symmetry plane y = 0, is absent: its hole at the wing root needs the root's
# outline, and the stored roots are open on every geometry but LHC001, so it cannot be built for every case (a
# rebuild of the root outline from the stored vertices is being prototyped).
# The far field points into the fluid; the stored wing is wound into the body (its signed volume is negative on the
# 4 cases checked), so it is reversed for ISLA only, as isla_surface.yaml reverses DrivAerML's vehicle.

# The mesh contract, measure and frame notes are those of isla_surface.yaml.
input_type: mesh
output_type: mesh

dataset_append_transforms:
  - _target_: ${dp:FlipBoundaryOrientation}
    boundaries: [vehicle]

# Learning rate: 3.75e-4, the reference configuration's rate (REF-80 verdict,
# 2026-10-04), which is the width rule lr = 1e-3 x 192 / hidden at hidden 512.
# Pinned here because the recipe's default of 3e-3 (GeoTransolver's) drives
# ISLA within five epochs to a mean-field plateau (validation loss 0.06
# against 0.0008 at 1e-3, 192 wide; book notebook: lrref-verdict) and 1e-2
# diverges. For other widths start from the width rule (5e-4 at 384). A CLI
# override still wins.
training:
  optimizer:
    lr: 3.75e-4

# Whole-model torch.compile: one graph, compiled once for every token count; see isla_volume.yaml.
compile: true
compile_options:
  fullgraph: true
  dynamic: true
  options:                       # mode max-autotune-no-cudagraphs's options, with mix-order reduction off
    max_autotune: true           # (torch 2.12-2.13 miscompile it; see isla_volume_airfrans.yaml)
    coordinate_descent_tuning: true
    triton.mix_order_reduction: false

forward_kwargs:
  boundary_meshes:                    # Mesh[2, 3] each; centroids, normals and measures are read from them
    vehicle: boundaries.vehicle       # the subsampled wing, with its Horvitz-Thompson measures
    inlet: boundaries.inlet           # the hemisphere's upstream half, whole, as the dataset builds it
    outlet: boundaries.outlet         # its downstream half
  prediction_boundaries: {literal: [vehicle]}   # the outputs are predicted at the wing's cells only
  global_data: global_data            # the case's TensorDict; the model selects its declared leaves

model:
  _target_: physicsnemo.experimental.models.isla.ISLA
  output_schema:                 # the HiLift wing targets, by name and tensor rank (0 scalar, 1 vector)
    pressure: {rank: 0}
    temperature: {rank: 0}
    density: {rank: 0}
    velocity: {rank: 1}
    tau_wall: {rank: 1}
  boundary_schemas:              # the boundary conditions by name, each with its own per-cell fields
    vehicle: {}                  # the wing surface, a no-slip wall: no per-cell fields
    inlet: {}                    # the far field's pieces carry no field: each condition is its name
    outlet: {}
  global_schema:
    U_inf_dir: {rank: 1}         # a rank-1 global input, read from global_data.U_inf_dir; normalized to a unit direction inside the model
  hidden: 512                  # the reference configuration (REF-80 verdict, 2026-10-04): most accurate under 80 GiB per GPU on DrivAerML Surface and the 210-wing rung; equal to the class defaults
  n_layers: 12
  n_slices: 512
  # Per-block torch.compile (PERF-3, 2026-10-01): off, since the recipe compiles
  # the whole model (compile_options above). The way to compile ISLA-DTT
  # (model.query_independent=true), whose boundary read breaks the whole-model graph.
  compile_blocks: false
