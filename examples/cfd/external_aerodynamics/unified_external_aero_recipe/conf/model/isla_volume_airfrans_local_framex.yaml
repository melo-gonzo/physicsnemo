# @package _global_
# FRAME-AF local mechanism rung (2026-09-23): ISLA at the exploration width (192 x 12, 256 slices, cosine routing, fused kernel)
# FRAME-AF-X control (2026-09-23): the freestream direction plus ONE laboratory axis (x only, K = 2, fused); discriminates whether the frame gain needs both axes.
input_type: tensors
output_type: fields
forward_kwargs:
  points: boundaries.airfoil.cell_centroids
  normals: boundaries.airfoil.cell_data.normals            # precomputed in-plane normals (a curve in 3-D has no cell_normals)
  measure_weights: boundaries.airfoil.cell_data.quadrature_measure
  global_inputs:
    freestream: global_data.U_inf_dir
    frame_x: global_data.frame_x            # FRAME-AF-X control: one laboratory axis only (K = 2)
    speed: global_data.U_inf_mag
  query_points: interior.points
model:
  _target_: physicsnemo.experimental.models.ISLA
  outputs: {pressure: 0, nut: 0, velocity: 1}
  global_inputs: {freestream: 1, frame_x: 1, speed: 0}
  hidden: 192
  n_layers: 12
  n_slices: 256
  mlp_ratio: 4
  scale_mode: rms_distance
  query_tokens: true
  query_mass: source_total
  geo_checkpoint: true
  geo_kernel: fused
