# ---------------------------------------------------------------------------
# Transolver template -- VOLUME recipe for AeroZoo v1.2, physical inputs.
# ---------------------------------------------------------------------------
# AZ-COMPLIANT v2 (2026-10-19): transolver_volume.yaml's inputs on
# datasets/aerozoo_puvolume*.yaml (the PDE data only, in SI units, no per-case
# scale). The embedding is the query point (m, raw) with its signed distance
# and normal to the no_slip body (m), the published body-SDF input; fx is
# log10 nu standardized by per-dataset constants (nu_std), broadcast to every
# point, the published channel for global scalars. Transolver has only
# per-point channels, and AeroZoo has no global freestream (any reduction of
# the inlet faces would be derived by the recipe), so it does not see the
# inlet velocity: a documented floor (PREREG_v2 Q2), run on `full` only.
# The loss, its field weights and the score space are every AeroZoo v2
# arm's (geotransolver_volume_aerozoo.yaml): case_relative_l2 with velocity
# weighing 3 (the label era's channel balance), scored in label_reference.
dataset_reader_overrides:
  # The boundaries stay: the SDF to no_slip is computed from them.
  drop_in_file_boundaries: false

input_type: tensors
output_type: tensors

training:
  loss_type: case_relative_l2
  field_weights:
    velocity: 3

score_space: label_reference

forward_kwargs:
  embedding:
    - interior.points
    - interior.point_data.sdf_wall
    - interior.point_data.sdf_wall_normals
  fx:
    source: global_data.nu_std
    expand_like: embedding

model:
  _target_: physicsnemo.models.transolver.Transolver
  out_dim: ${out_dim}     # auto-set from the chosen dataset's `targets:` block
  functional_dim: 1       # fx = nu_std (1)
  embedding_dim: 7        # embedding = points (3) + sdf_wall (1) + sdf_wall_normals (3)
  n_layers: 12
  n_hidden: 256
  dropout: 0.0
  n_head: 8
  act: "gelu"
  mlp_ratio: 4
  slice_num: 256
  unified_pos: false
  structured_shape: null  # unstructured mesh
  use_te: false
  plus: false
  activation_checkpointing: false
  checkpointing_ratio: 1.0
