# GLOBE, surface task, on DrivAerML (pair with datasets/drivaer_ml_surface.yaml and its _area / _posed twins, the files
# ISLA's lanes read). GLOBE-SCORE, 2026-10-19: conf/model/globe_surface.yaml (the recipe's GLOBE template) with GLOBE's
# own DrivAerML example settings (examples/cfd/external_aerodynamics/globe/drivaer/train.py: hidden 256 x 3, 8 latent
# scalars, 4 latent vectors, 4 Legendre terms, theta 1.5, Pade kernels) in place of the template's theta 10 and one
# Legendre term, and with the unit freestream direction as GLOBE's one global vector.
#
# Inputs, the same information as ISLA's: the vehicle surface (GLOBE computes normals and areas from the geometry and
# uses the subsample's effective cell measure; it reads no stored field), U_inf_dir (rank 1; ISLA's one global input),
# and two constant reference lengths in the recipe's L_ref-nondimensional frame (L_ref = 5 m -> 1, delta_turb = 0.075 m
# -> 0.015, the same for every car). The example's ground-plane boundaries (slip floor upstream, no-slip floor
# downstream) are not given: ISLA does not get them, and on DrivAerML the flow direction they encode is U_inf_dir.
input_type: mesh
output_type: mesh

forward_kwargs:
  prediction_points: interior.points          # (K_cells, 3): the cell centroids where every model is scored
  boundary_meshes:
    vehicle: boundaries.vehicle               # Mesh[2, 3] with K_cells cells
  reference_lengths:
    L_ref: 1.0                                # nondim (positions scaled by L_ref = 5 m)
    delta_turb: 0.015                         # nondim (= 0.075 m / 5 m)
  global_data: global_data                    # GLOBE keeps its declared leaves (U_inf_dir)

model:
  _target_: physicsnemo.experimental.models.globe.GLOBE
  n_spatial_dims: 3
  output_schema:
    pressure: {rank: 0}
    wss: {rank: 1}
  boundary_source_schemas:
    vehicle: {}
  reference_length_names: [L_ref, delta_turb]
  reference_area: 0.0868                      # 2.170 m^2 / (5 m)^2
  global_schema:
    U_inf_dir: {rank: 1}
  n_communication_hyperlayers: 2
  hidden_layer_sizes: [256, 256, 256]
  n_latent_scalars: 8
  n_latent_vectors: 4
  n_spherical_harmonics: 4                    # the example's; the template has 1
  theta: 1.5                                  # the example's and the class default; the template has 10
  leaf_size: 1
  network_type: "pade"
  self_regularization_beta: 0.01
  latent_compression_scale: 100.0
  expand_far_targets: true
