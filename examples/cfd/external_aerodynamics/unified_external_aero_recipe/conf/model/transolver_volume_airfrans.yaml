# ---------------------------------------------------------------------------
# Transolver template -- VOLUME recipe for AirfRANS.
# ---------------------------------------------------------------------------
# Pair with datasets/airfrans_uvolume_ud.yaml (and its _area / _posed
# scoring twins). transolver_volume.yaml but for the freestream input.
#
# Freestream input (the drive rule, 2026-10-18): the unit freestream
# direction U_inf_dir and, because the AirfRANS speed varies per case
# (31-94 m/s), the standardized speed U_inf_mag_std, never the raw U_inf
# vector, concatenated and broadcast over the points as `fx`. U_inf_dir is
# stored in the case files; U_inf_mag_std is written by the _ud datasets'
# SplitGlobalVector with fixed full_train constants. The constant-speed
# datasets need no magnitude channel and use transolver_volume.yaml /
# transolver_surface.yaml instead.
dataset_reader_overrides:
  # This point-based model consumes only the volume interior.
  drop_in_file_boundaries: true

input_type: tensors
output_type: tensors

forward_kwargs:
  embedding:
    - interior.points
    - interior.point_data.sdf
    - interior.point_data.sdf_normals
  fx:
    source:
      - global_data.U_inf_dir
      - global_data.U_inf_mag_std
    expand_like: embedding

model:
  _target_: physicsnemo.models.transolver.Transolver
  out_dim: ${out_dim}     # auto-set from the chosen dataset's `targets:` block
  functional_dim: 4       # fx = U_inf_dir (3) + U_inf_mag_std (1)
  embedding_dim: 7        # embedding = points (3) + SDF (1) + SDF normals (3)
  n_layers: 12
  n_hidden: 256
  dropout: 0.0
  n_head: 8
  act: "gelu"
  mlp_ratio: 4
  slice_num: 256
  unified_pos: false
  structured_shape: null  # unstructured mesh
  use_te: false
  plus: false
  activation_checkpointing: false
  checkpointing_ratio: 1.0
